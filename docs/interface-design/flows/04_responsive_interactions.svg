<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aaaca"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1800" height="1240" rx="0" fill="#f5f7fb" stroke="#f5f7fb"/><text x="64" y="76" font-size="36" fill="#1a2739" font-weight="700">桌面与手机：同一能力，不同操作组织</text><text x="64" y="118" font-size="18" fill="#64748b" font-weight="400">手机端不缩小五列看板，也不删除高级功能；改变的是层级、布局与输入方式。</text><rect x="64" y="174" width="1672" height="70" rx="14" fill="#eef3ff" stroke="#dfe8ff"/><text x="88" y="220" font-size="20" fill="#345ee8" font-weight="650">页面</text><text x="324" y="220" font-size="20" fill="#345ee8" font-weight="650">桌面版</text><text x="923" y="220" font-size="20" fill="#345ee8" font-weight="650">移动版</text><rect x="64" y="244" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="290" font-size="22" fill="#1a2739" font-weight="650">总览</text><text x="324" y="290" font-size="19" fill="#1a2739" font-weight="400">任务表 + 待处理侧栏 + 运行环境</text><text x="923" y="290" font-size="19" fill="#1a2739" font-weight="400">待处理优先 → 3 条活跃任务 → 环境折叠</text><text x="324" y="333" font-size="17" fill="#64748b" font-weight="400">点击指标与任务进入同一份详情。</text><rect x="64" y="367" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="413" font-size="22" fill="#1a2739" font-weight="650">任务按状态</text><text x="324" y="413" font-size="19" fill="#1a2739" font-weight="400">五列工作项，列内滚动，保留筛选</text><text x="923" y="413" font-size="19" fill="#1a2739" font-weight="400">当前阶段选择器 + 单列卡片</text><text x="324" y="456" font-size="17" fill="#64748b" font-weight="400">切换阶段保留搜索，执行状态不能拖拽。</text><rect x="64" y="490" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="536" font-size="22" fill="#1a2739" font-weight="650">任务按角色</text><text x="324" y="536" font-size="19" fill="#1a2739" font-weight="400">角色 / 正在执行 / 就绪队列横向泳道</text><text x="923" y="536" font-size="19" fill="#1a2739" font-weight="400">角色选择器 + 执行 / 排队两个页签</text><text x="324" y="579" font-size="17" fill="#64748b" font-weight="400">容量与排队数固定可见，不横向挤压四条泳道。</text><rect x="64" y="613" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="659" font-size="22" fill="#1a2739" font-weight="650">角色配置</text><text x="324" y="659" font-size="19" fill="#1a2739" font-weight="400">设置目录 + 编辑表单 + 解析侧栏</text><text x="923" y="659" font-size="19" fill="#1a2739" font-weight="400">分区编辑 + 明确模型来源 + 底部保存</text><text x="324" y="702" font-size="17" fill="#64748b" font-weight="400">切换设置分区保留草稿，退出前说明未保存。</text><rect x="64" y="736" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="782" font-size="22" fill="#1a2739" font-weight="650">任务详情</text><text x="324" y="782" font-size="19" fill="#1a2739" font-weight="400">证据时间线 + 当前运行 / 交付侧栏</text><text x="923" y="782" font-size="19" fill="#1a2739" font-weight="400">当前动作优先，轨迹与日志按需展开</text><text x="324" y="825" font-size="17" fill="#64748b" font-weight="400">日志局部横向滚动不造成整页溢出。</text><rect x="64" y="859" width="1672" height="123" rx="0" fill="white" stroke="#dfe6f0"/><text x="88" y="905" font-size="22" fill="#1a2739" font-weight="650">管理助手</text><text x="324" y="905" font-size="19" fill="#1a2739" font-weight="400">会话列表 + 对话 + 上下文三栏</text><text x="923" y="905" font-size="19" fill="#1a2739" font-weight="400">全屏对话，范围固定，快捷操作折叠</text><text x="324" y="948" font-size="17" fill="#64748b" font-weight="400">切换整页/面板不重发消息；发送与业务回执分开。</text><rect x="64" y="1023" width="1672" height="147" rx="14" fill="white" stroke="#dfe6f0"/><text x="91" y="1066" font-size="23" fill="#1a2739" font-weight="650">手机底部导航</text><rect x="400" y="1045" width="230" height="66" rx="10" fill="#f7f9fe" stroke="#dfe6f0"/><text x="478" y="1087" font-size="23" fill="#345ee8" font-weight="600">总览</text><rect x="696" y="1045" width="230" height="66" rx="10" fill="#f7f9fe" stroke="#dfe6f0"/><text x="774" y="1087" font-size="23" fill="#345ee8" font-weight="600">任务</text><rect x="992" y="1045" width="230" height="66" rx="10" fill="#f7f9fe" stroke="#dfe6f0"/><text x="1070" y="1087" font-size="23" fill="#345ee8" font-weight="600">待办</text><rect x="1288" y="1045" width="230" height="66" rx="10" fill="#f7f9fe" stroke="#dfe6f0"/><text x="1366" y="1087" font-size="23" fill="#345ee8" font-weight="600">更多</text><text x="92" y="1144" font-size="17" fill="#64748b" font-weight="400">交互目标：44×44px 触控区 · 输入字号 16px · 可见键盘焦点 · 320px 以上无页面级横向溢出 · 减少动态效果</text></svg>