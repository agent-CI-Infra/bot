<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aaaca"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1800" height="1260" rx="0" fill="#f5f7fb" stroke="#f5f7fb"/><text x="64" y="76" font-size="36" fill="#1a2739" font-weight="700">配置生效与版本发布</text><text x="64" y="118" font-size="18" fill="#64748b" font-weight="400">把“保存了什么”“影响谁”“何时生效”放在确认动作之前。</text><text x="64" y="181" font-size="26" fill="#1a2739" font-weight="650">A. 角色配置</text><rect x="64" y="210" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="86" y="232" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="95" y="254" font-size="17" fill="#345ee8" font-weight="700">1</text><text x="134" y="256" font-size="24" fill="#1a2739" font-weight="600">选择 Agent</text><text x="88" y="301" font-size="18" fill="#64748b" font-weight="400">已注册后端才可使用</text><text x="88" y="332" font-size="18" fill="#64748b" font-weight="400">不可用项说明接入原因</text><path d="M447,315 L489,315" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="494" y="210" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="516" y="232" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="525" y="254" font-size="17" fill="#345ee8" font-weight="700">2</text><text x="564" y="256" font-size="24" fill="#1a2739" font-weight="600">匹配模型来源</text><text x="518" y="301" font-size="18" fill="#64748b" font-weight="400">平台模型：允许选择</text><text x="518" y="332" font-size="18" fill="#64748b" font-weight="400">externalModel：Agent 自带</text><path d="M877,315 L919,315" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="924" y="210" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="946" y="232" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="955" y="254" font-size="17" fill="#345ee8" font-weight="700">3</text><text x="994" y="256" font-size="24" fill="#1a2739" font-weight="600">预览与保存</text><text x="948" y="301" font-size="18" fill="#64748b" font-weight="400">展示来源、能力与版本</text><text x="948" y="332" font-size="18" fill="#64748b" font-weight="400">expected_revision 冲突保草稿</text><path d="M1307,315 L1349,315" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1354" y="210" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="1376" y="232" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="1385" y="254" font-size="17" fill="#345ee8" font-weight="700">4</text><text x="1424" y="256" font-size="24" fill="#1a2739" font-weight="600">采用新版本</text><text x="1378" y="301" font-size="18" fill="#64748b" font-weight="400">新执行按新配置解析</text><text x="1378" y="332" font-size="18" fill="#64748b" font-weight="400">旧运行需安全点显式采用</text><rect x="64" y="446" width="1672" height="103" rx="14" fill="#fff9ee" stroke="#f0e1c6"/><text x="90" y="484" font-size="23" fill="#9a6415" font-weight="650">不静默替换</text><text x="294" y="484" font-size="18" fill="#64748b" font-weight="400">模型、Agent、候选、授权或策略发生变化时，界面必须说明影响，不能伪装为原执行的延续。</text><text x="90" y="523" font-size="18" fill="#64748b" font-weight="400">普通保存不默认走审批；只有组织明确规定的操作进入 awaiting_approval。</text><text x="64" y="615" font-size="26" fill="#1a2739" font-weight="650">B. 发布版本</text><rect x="64" y="647" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="86" y="669" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="95" y="691" font-size="17" fill="#345ee8" font-weight="700">1</text><text x="134" y="693" font-size="24" fill="#1a2739" font-weight="600">准备版本</text><text x="88" y="738" font-size="18" fill="#64748b" font-weight="400">SemVer 必须升高</text><text x="88" y="769" font-size="18" fill="#64748b" font-weight="400">有新提交，固定 SHA</text><path d="M447,750 L489,750" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="494" y="647" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="516" y="669" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="525" y="691" font-size="17" fill="#345ee8" font-weight="700">2</text><text x="564" y="693" font-size="24" fill="#1a2739" font-weight="600">确认打标签</text><text x="518" y="738" font-size="18" fill="#64748b" font-weight="400">明确第一次写入</text><text x="518" y="769" font-size="18" fill="#64748b" font-weight="400">同名标签不移动</text><path d="M877,750 L919,750" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="924" y="647" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="946" y="669" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="955" y="691" font-size="17" fill="#345ee8" font-weight="700">3</text><text x="994" y="693" font-size="24" fill="#1a2739" font-weight="600">CI 与说明草稿</text><text x="948" y="738" font-size="18" fill="#64748b" font-weight="400">按 job 结果判定</text><text x="948" y="769" font-size="18" fill="#64748b" font-weight="400">AI 分析只提供建议</text><path d="M1307,750 L1349,750" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1354" y="647" width="380" height="205" rx="14" fill="white" stroke="#dfe6f0"/><rect x="1376" y="669" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="1385" y="691" font-size="17" fill="#345ee8" font-weight="700">4</text><text x="1424" y="693" font-size="24" fill="#1a2739" font-weight="600">正式发布</text><text x="1378" y="738" font-size="18" fill="#64748b" font-weight="400">人工第二次确认</text><text x="1378" y="769" font-size="18" fill="#64748b" font-weight="400">不等于包或镜像发布</text><rect x="64" y="891" width="1672" height="240" rx="14" fill="white" stroke="#dfe6f0"/><text x="90" y="933" font-size="24" fill="#1a2739" font-weight="650">异常与返回路径</text><text x="92" y="978" font-size="18" fill="#345ee8" font-weight="550">配置版本冲突</text><text x="360" y="978" font-size="18" fill="#64748b" font-weight="400">保留草稿 → 查看双方差异 → 重新绑定当前版本 → 再次提交。</text><text x="92" y="1014" font-size="18" fill="#345ee8" font-weight="550">外部写入结果未知</text><text x="360" y="1014" font-size="18" fill="#64748b" font-weight="400">先对账已有 tag / PR / Release；未确认结果前不重复创建。</text><text x="92" y="1050" font-size="18" fill="#345ee8" font-weight="550">没有新提交或检查失败</text><text x="360" y="1050" font-size="18" fill="#64748b" font-weight="400">停在当前步骤说明原因；不能跳过门禁或用模型结论代替成功。</text><text x="92" y="1086" font-size="18" fill="#345ee8" font-weight="550">权限或安装范围变化</text><text x="360" y="1086" font-size="18" fill="#64748b" font-weight="400">停止后续副作用；重新读取当前授权，不借用其他人的能力。</text></svg>