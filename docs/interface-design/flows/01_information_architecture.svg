<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aaaca"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1800" height="1320" rx="0" fill="#f5f7fb" stroke="#f5f7fb"/><text x="64" y="76" font-size="36" fill="#1a2739" font-weight="700">全站信息架构</text><text x="64" y="118" font-size="18" fill="#64748b" font-weight="400">以当前代码为基线：项目工作区与平台管理分层，57 个页面 / 详情场景。</text><rect x="510" y="165" width="780" height="92" rx="14" fill="#eef3ff" stroke="#cbd8fb"/><text x="548" y="203" font-size="25" fill="#345ee8" font-weight="600">工作空间 · 先选组织 / 项目，再执行操作</text><text x="548" y="236" font-size="18" fill="#64748b" font-weight="400">人类授权、GitHub 安装范围与当前资源状态共同约束可见内容</text><path d="M900,258 L315,311" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900,258 L895,311" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900,258 L1475,311" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="64" y="314" width="512" height="252" rx="14" fill="white" stroke="#dfe6f0"/><rect x="86" y="336" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="95" y="358" font-size="17" fill="#345ee8" font-weight="700">01</text><text x="134" y="360" font-size="24" fill="#1a2739" font-weight="600">项目推进</text><text x="88" y="405" font-size="18" fill="#64748b" font-weight="400">项目总览 / 待我处理</text><text x="88" y="436" font-size="18" fill="#64748b" font-weight="400">按状态任务看板 / 角色队列</text><text x="88" y="467" font-size="18" fill="#64748b" font-weight="400">任务详情 / 新建任务</text><text x="88" y="498" font-size="18" fill="#64748b" font-weight="400">管理助手 / 命令审批</text><rect x="644" y="314" width="512" height="252" rx="14" fill="white" stroke="#dfe6f0"/><rect x="666" y="336" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="675" y="358" font-size="17" fill="#345ee8" font-weight="700">02</text><text x="714" y="360" font-size="24" fill="#1a2739" font-weight="600">AI 与运行配置</text><text x="668" y="405" font-size="18" fill="#64748b" font-weight="400">AI 团队 / 角色详情 / Manager</text><text x="668" y="436" font-size="18" fill="#64748b" font-weight="400">事件分派记录 / 分派详情</text><text x="668" y="467" font-size="18" fill="#64748b" font-weight="400">技能包 / 阶段与验收策略</text><text x="668" y="498" font-size="18" fill="#64748b" font-weight="400">模型 / 供应商 / 项目电脑</text><rect x="1224" y="314" width="512" height="252" rx="14" fill="white" stroke="#dfe6f0"/><rect x="1246" y="336" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="1255" y="358" font-size="17" fill="#345ee8" font-weight="700">03</text><text x="1294" y="360" font-size="24" fill="#1a2739" font-weight="600">交付与项目管理</text><text x="1248" y="405" font-size="18" fill="#64748b" font-weight="400">项目知识 / 条目 / 角色记忆</text><text x="1248" y="436" font-size="18" fill="#64748b" font-weight="400">CI 接入 / 版本准备 / 发布详情</text><text x="1248" y="467" font-size="18" fill="#64748b" font-weight="400">定时计划 / 订阅 / 发送回执</text><text x="1248" y="498" font-size="18" fill="#64748b" font-weight="400">用量、审计、成员与项目设置</text><text x="65" y="635" font-size="26" fill="#1a2739" font-weight="650">平台管理 · 不与项目日常操作混在同一级菜单</text><rect x="64" y="674" width="512" height="225" rx="14" fill="white" stroke="#dfe6f0"/><rect x="86" y="696" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="95" y="718" font-size="17" fill="#345ee8" font-weight="700">04</text><text x="134" y="720" font-size="24" fill="#1a2739" font-weight="600">安装与执行身份</text><text x="88" y="765" font-size="18" fill="#64748b" font-weight="400">安装档案 / 安装证据详情</text><text x="88" y="796" font-size="18" fill="#64748b" font-weight="400">机器人账号 / 请求配额</text><text x="88" y="827" font-size="18" fill="#64748b" font-weight="400">外部执行端 / 能力核验</text><rect x="644" y="674" width="512" height="225" rx="14" fill="white" stroke="#dfe6f0"/><rect x="666" y="696" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="675" y="718" font-size="17" fill="#345ee8" font-weight="700">05</text><text x="714" y="720" font-size="24" fill="#1a2739" font-weight="600">人类与消息身份</text><text x="668" y="765" font-size="18" fill="#64748b" font-weight="400">我的身份 / 当前有效授权</text><text x="668" y="796" font-size="18" fill="#64748b" font-weight="400">平台用户 / 显式委派</text><text x="668" y="827" font-size="18" fill="#64748b" font-weight="400">消息渠道 / 飞书双端绑定</text><rect x="1224" y="674" width="512" height="225" rx="14" fill="white" stroke="#dfe6f0"/><rect x="1246" y="696" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="1255" y="718" font-size="17" fill="#345ee8" font-weight="700">06</text><text x="1294" y="720" font-size="24" fill="#1a2739" font-weight="600">部署与共享资源</text><text x="1248" y="765" font-size="18" fill="#64748b" font-weight="400">平台默认 / 公网与登录入口</text><text x="1248" y="796" font-size="18" fill="#64748b" font-weight="400">部署共享模型 / 凭据管理</text><text x="1248" y="827" font-size="18" fill="#64748b" font-weight="400">七步接入向导 / Webhook 诊断</text><rect x="64" y="947" width="1672" height="276" rx="14" fill="white" stroke="#dfe6f0"/><text x="92" y="991" font-size="25" fill="#1a2739" font-weight="650">独立入口与兼容迁移</text><text x="96" y="1038" font-size="18" fill="#345ee8" font-weight="600">登录与初始化</text><text x="340" y="1038" font-size="18" fill="#64748b" font-weight="400">GitHub 登录主入口；本地超级管理员保留恢复能力。</text><text x="96" y="1081" font-size="18" fill="#345ee8" font-weight="600">公开只读看板</text><text x="340" y="1081" font-size="18" fill="#64748b" font-weight="400">使用最小公开字段投影，不复用管理端原始日志。</text><text x="96" y="1124" font-size="18" fill="#345ee8" font-weight="600">手机底部导航</text><text x="340" y="1124" font-size="18" fill="#64748b" font-weight="400">总览 / 任务 / 待办 / 更多；其余功能完整保留。</text><text x="96" y="1167" font-size="18" fill="#345ee8" font-weight="600">旧地址兼容</text><text x="340" y="1167" font-size="18" fill="#64748b" font-weight="400">保留旧任务入口与链接映射，不重新引入已删除的工作流编辑器。</text><text x="65" y="1282" font-size="16" fill="#64748b" font-weight="400">完整逐页映射、现有能力与后端差距见 design_spec.html；当前设计不修改仓库。</text></svg>