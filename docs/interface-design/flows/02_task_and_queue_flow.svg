<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aaaca"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="1800" height="1290" rx="0" fill="#f5f7fb" stroke="#f5f7fb"/><text x="64" y="76" font-size="36" fill="#1a2739" font-weight="700">任务状态与角色队列的交互</text><text x="64" y="118" font-size="18" fill="#64748b" font-weight="400">状态来自事实；移动的是委派 / 运行记录，而不是用拖拽伪造“完成”。</text><rect x="64" y="175" width="380" height="207" rx="14" fill="white" stroke="#dfe6f0"/><rect x="86" y="197" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="95" y="219" font-size="17" fill="#345ee8" font-weight="700">1</text><text x="134" y="221" font-size="24" fill="#1a2739" font-weight="600">发现需要处理的事项</text><text x="88" y="266" font-size="18" fill="#64748b" font-weight="400">总览指标 → 待我处理</text><text x="88" y="297" font-size="18" fill="#64748b" font-weight="400">先展示原因和责任人</text><path d="M447,280 L488,280" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="494" y="175" width="380" height="207" rx="14" fill="white" stroke="#dfe6f0"/><rect x="516" y="197" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="525" y="219" font-size="17" fill="#345ee8" font-weight="700">2</text><text x="564" y="221" font-size="24" fill="#1a2739" font-weight="600">查看与处理</text><text x="518" y="266" font-size="18" fill="#64748b" font-weight="400">任务当前动作 + 来源证据</text><text x="518" y="297" font-size="18" fill="#64748b" font-weight="400">补说明 / 改合同 / 修配置</text><path d="M877,280 L918,280" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="924" y="175" width="380" height="207" rx="14" fill="white" stroke="#dfe6f0"/><rect x="946" y="197" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="955" y="219" font-size="17" fill="#345ee8" font-weight="700">3</text><text x="994" y="221" font-size="24" fill="#1a2739" font-weight="600">继续与交付</text><text x="948" y="266" font-size="18" fill="#64748b" font-weight="400">可用条件满足后恢复</text><text x="948" y="297" font-size="18" fill="#64748b" font-weight="400">QA、CI、人工检视分别显示</text><path d="M1307,280 L1348,280" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1354" y="175" width="380" height="207" rx="14" fill="white" stroke="#dfe6f0"/><rect x="1376" y="197" width="35" height="30" rx="7" fill="#eef3ff" stroke="#eef3ff"/><text x="1385" y="219" font-size="17" fill="#345ee8" font-weight="700">4</text><text x="1424" y="221" font-size="24" fill="#1a2739" font-weight="600">维护者合入</text><text x="1378" y="266" font-size="18" fill="#64748b" font-weight="400">AI 已交付不等于已合入</text><text x="1378" y="297" font-size="18" fill="#64748b" font-weight="400">合入仍遵守 GitHub 规则</text><text x="65" y="451" font-size="26" fill="#1a2739" font-weight="650">角色队列连续补位 · 目标能力，需补真实的角色调度与准入接口</text><rect x="64" y="485" width="512" height="520" rx="14" fill="white" stroke="#dfe6f0"/><text x="88" y="531" font-size="25" fill="#1a2739" font-weight="650">运行中</text><text x="88" y="567" font-size="20" fill="#345ee8" font-weight="600">执行 3 / 3 · 队列 4</text><rect x="88" y="590" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="103" y="621" font-size="19" fill="#1a2739" font-weight="400">#219 权限同步</text><rect x="88" y="650" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="103" y="681" font-size="19" fill="#1a2739" font-weight="400">#227 恢复机制</text><rect x="88" y="710" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="103" y="741" font-size="19" fill="#1a2739" font-weight="400">#235 签名校验</text><text x="88" y="800" font-size="17" fill="#64748b" font-weight="600">等待队列</text><text x="92" y="835" font-size="17" fill="#64748b" font-weight="400">1</text><text x="121" y="835" font-size="18" fill="#1a2739" font-weight="400">#197 优先级 / FIFO</text><text x="92" y="867" font-size="17" fill="#64748b" font-weight="400">2</text><text x="121" y="867" font-size="18" fill="#1a2739" font-weight="400">#230 安装权限</text><text x="92" y="899" font-size="17" fill="#64748b" font-weight="400">3</text><text x="121" y="899" font-size="18" fill="#1a2739" font-weight="400">#231 重试退避</text><text x="92" y="931" font-size="17" fill="#64748b" font-weight="400">4</text><text x="121" y="931" font-size="18" fill="#1a2739" font-weight="400">#238 批量去重</text><path d="M580,723 L635,723" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="644" y="485" width="512" height="520" rx="14" fill="white" stroke="#dfe6f0"/><text x="668" y="531" font-size="25" fill="#1a2739" font-weight="650">完成并释放名额</text><text x="668" y="567" font-size="20" fill="#345ee8" font-weight="600">执行 2 / 3 · 队列 4</text><rect x="668" y="590" width="464" height="49" rx="8" fill="#fcfdff" stroke="#d9e2f3"/><text x="683" y="621" font-size="19" fill="#64748b" font-weight="400">空闲名额</text><rect x="668" y="650" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="683" y="681" font-size="19" fill="#1a2739" font-weight="400">#227 恢复机制</text><rect x="668" y="710" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="683" y="741" font-size="19" fill="#1a2739" font-weight="400">#235 签名校验</text><text x="668" y="800" font-size="17" fill="#64748b" font-weight="600">等待队列</text><text x="672" y="835" font-size="17" fill="#64748b" font-weight="400">1</text><text x="701" y="835" font-size="18" fill="#1a2739" font-weight="400">#197 优先级 / FIFO</text><text x="672" y="867" font-size="17" fill="#64748b" font-weight="400">2</text><text x="701" y="867" font-size="18" fill="#1a2739" font-weight="400">#230 安装权限</text><text x="672" y="899" font-size="17" fill="#64748b" font-weight="400">3</text><text x="701" y="899" font-size="18" fill="#1a2739" font-weight="400">#231 重试退避</text><text x="672" y="931" font-size="17" fill="#64748b" font-weight="400">4</text><text x="701" y="931" font-size="18" fill="#1a2739" font-weight="400">#238 批量去重</text><path d="M1160,723 L1215,723" stroke="#9aaaca" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1224" y="485" width="512" height="520" rx="14" fill="white" stroke="#dfe6f0"/><text x="1248" y="531" font-size="25" fill="#1a2739" font-weight="650">队首开始执行</text><text x="1248" y="567" font-size="20" fill="#345ee8" font-weight="600">执行 3 / 3 · 队列 3</text><rect x="1248" y="590" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="1263" y="621" font-size="19" fill="#1a2739" font-weight="400">#197 优先级 / FIFO</text><rect x="1248" y="650" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="1263" y="681" font-size="19" fill="#1a2739" font-weight="400">#227 恢复机制</text><rect x="1248" y="710" width="464" height="49" rx="8" fill="#f8faff" stroke="#d9e2f3"/><text x="1263" y="741" font-size="19" fill="#1a2739" font-weight="400">#235 签名校验</text><text x="1248" y="800" font-size="17" fill="#64748b" font-weight="600">等待队列</text><text x="1252" y="835" font-size="17" fill="#64748b" font-weight="400">1</text><text x="1281" y="835" font-size="18" fill="#1a2739" font-weight="400">#230 安装权限</text><text x="1252" y="867" font-size="17" fill="#64748b" font-weight="400">2</text><text x="1281" y="867" font-size="18" fill="#1a2739" font-weight="400">#231 重试退避</text><text x="1252" y="899" font-size="17" fill="#64748b" font-weight="400">3</text><text x="1281" y="899" font-size="18" fill="#1a2739" font-weight="400">#238 批量去重</text><rect x="64" y="1048" width="1672" height="151" rx="14" fill="#eef3ff" stroke="#d4e0ff"/><text x="90" y="1088" font-size="22" fill="#345ee8" font-weight="650">动画与真实状态的关系</text><text x="90" y="1125" font-size="18" fill="#64748b" font-weight="400">完成回执先确认 → 释放名额 → 原子领取队首 → 新运行建立；队列索引与计数同步更新。</text><text x="90" y="1154" font-size="18" fill="#64748b" font-weight="400">空闲名额仍可能被项目限额、环境、预算或授权阻塞；显示实际原因，不自动借用其他角色名额。</text><text x="90" y="1183" font-size="18" fill="#64748b" font-weight="400">保留短暂过渡与减少动态效果选项；屏幕阅读器只在关键状态改变时播报。</text></svg>