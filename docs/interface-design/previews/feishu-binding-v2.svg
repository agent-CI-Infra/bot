<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><title>飞书 v2：管理员管理应用，用户添加联系人并发送绑定串</title><desc>桌面和手机个人绑定设计，以及独立的管理员配置入口。所有数据和绑定串均为示例。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft Yahei',sans-serif;fill:#18283e}.muted{fill:#718099}.blue{fill:#345ee8}.small{font-size:14px}.body{font-size:17px}.heading{font-size:22px;font-weight:650}.white{fill:white}</style><rect width="1600" height="1110" fill="#f6f8fc"/><text x="46" y="48" font-size="27" font-weight="700">飞书：配置只给管理员，绑定只给用户</text><text x="46" y="79" class="muted body">修订 v2 · 普通用户无需创建 App、填写密钥或多次往返确认 · 示例数据</text><rect x="44" y="110" width="1070" height="664" rx="14" fill="white" stroke="#e4eaf2"/><path d="M44 166H1114" stroke="#e4eaf2"/><text x="70" y="145" class="small muted">开发工作台　 /　个人设置　 /　飞书绑定</text><text x="79" y="219" font-size="29" font-weight="700">绑定飞书</text><text x="79" y="250" class="body muted">添加团队机器人，发送一条绑定消息，就可以开始使用。</text><rect x="78" y="277" width="630" height="456" rx="10" fill="white" stroke="#e4eaf2"/><rect x="102" y="301" width="51" height="51" rx="13" fill="#eef3ff"/><text x="117" y="335" font-size="19" class="blue" font-weight="700">AI</text><text x="169" y="323" class="heading">研发助手</text><text x="169" y="348" class="small muted">由团队管理员提供 · 研发团队</text><rect x="599" y="310" width="81" height="29" rx="5" fill="#eaf7f0"/><text x="615" y="330" class="small" style="fill:#168966">可使用</text><path d="M102 374H681" stroke="#e4eaf2"/><circle cx="118" cy="408" r="15" fill="#eef3ff"/><text x="113" y="414" class="blue body">1</text><text x="147" y="414" class="body" font-weight="650">添加机器人联系人</text><text x="147" y="443" class="small muted">打开名片，添加「研发助手」并进入私聊。</text><rect x="147" y="457" width="185" height="42" rx="7" fill="white" stroke="#dce4f0"/><text x="168" y="484" class="small">打开机器人名片 ↗</text><circle cx="118" cy="531" r="15" fill="#eef3ff"/><text x="113" y="537" class="blue body">2</text><text x="147" y="537" class="body" font-weight="650">发送这条绑定消息</text><rect x="147" y="554" width="534" height="63" rx="8" fill="#f6f9ff" stroke="#dce6ff"/><text x="164" y="593" font-size="22" class="blue">绑定 K7M2-P9Q4-X6RT</text><rect x="557" y="567" width="108" height="37" rx="6" fill="#345ee8"/><text x="579" y="591" class="small white">复制消息</text><text x="147" y="645" class="small muted">5 分钟内有效 · 单次使用 · 不要转发或发送到群里</text><path d="M102 672H681" stroke="#e4eaf2"/><text x="107" y="706" class="small blue">○ 等待你在飞书发送消息…</text><text x="611" y="706" class="small blue">刷新状态</text><rect x="731" y="278" width="347" height="326" rx="10" fill="#fbfcfe" stroke="#e4eaf2"/><text x="755" y="311" class="body" font-weight="600">飞书 · 研发助手</text><text x="977" y="311" class="small muted">私聊示意</text><path d="M731 329H1078" stroke="#e4eaf2"/><rect x="771" y="353" width="285" height="50" rx="8" fill="#eaf0ff"/><text x="787" y="385" font-size="16" class="blue">绑定 K7M2-P9Q4-X6RT</text><rect x="752" y="428" width="278" height="117" rx="8" fill="white" stroke="#e4eaf2"/><text x="769" y="457" class="body" style="fill:#168966" font-weight="650">✓ 绑定成功</text><text x="769" y="488" class="small">已关联工作台账号「林舟」。</text><text x="769" y="516" class="small muted">可以查询你有权访问的项目。</text><text x="755" y="579" class="small muted">验证消息后，网页自动显示绑定结果</text><rect x="731" y="626" width="347" height="107" rx="10" fill="#f7f9fd"/><text x="751" y="656" font-size="15" font-weight="650">普通用户看不到应用配置</text><text x="751" y="685" class="small muted">不展示 App ID、Secret、回调地址</text><text x="751" y="711" class="small muted">绑定只关联身份，不新增项目权限</text><text x="1161" y="140" class="body muted">移动端 · 同样只需两步</text><rect x="1152" y="161" width="404" height="720" rx="18" fill="white" stroke="#dce4f0"/><text x="1177" y="201" class="body">‹　个人设置</text><path d="M1152 221H1556" stroke="#e4eaf2"/><text x="1179" y="267" font-size="27" font-weight="700">绑定飞书</text><text x="1179" y="298" class="small muted">使用管理员已创建的机器人</text><rect x="1174" y="322" width="360" height="474" rx="10" fill="white" stroke="#e4eaf2"/><rect x="1194" y="344" width="44" height="44" rx="12" fill="#eef3ff"/><text x="1205" y="373" class="blue body">AI</text><text x="1253" y="363" class="heading">研发助手</text><text x="1253" y="388" class="small muted">研发团队 · 可使用</text><text x="1195" y="438" class="body" font-weight="650">① 添加机器人联系人</text><rect x="1194" y="455" width="319" height="44" rx="7" fill="white" stroke="#dce4f0"/><text x="1266" y="483" class="small">打开机器人名片 ↗</text><text x="1195" y="541" class="body" font-weight="650">② 发送绑定消息</text><rect x="1194" y="559" width="319" height="118" rx="8" fill="#f6f9ff" stroke="#dce6ff"/><text x="1210" y="594" font-size="18" class="blue">绑定 K7M2-P9Q4-X6RT</text><rect x="1208" y="611" width="290" height="48" rx="7" fill="#345ee8"/><text x="1303" y="642" class="body white">复制绑定消息</text><text x="1195" y="707" class="small muted">5 分钟有效 · 仅可使用一次</text><text x="1195" y="753" class="small blue">○ 等待收到绑定消息…</text><path d="M1152 818H1556" stroke="#e4eaf2"/><text x="1182" y="854" class="small muted">总览　　　任务　　　待处理　　　更多</text><rect x="44" y="803" width="1070" height="246" rx="12" fill="white" stroke="#e4eaf2"/><text x="72" y="842" class="heading">管理员独立入口：平台设置 → 飞书应用</text><text x="72" y="874" class="body muted">创建或接入 App、凭据与事件、发布范围、连接诊断、群授权均留在管理员页面。</text><rect x="72" y="900" width="215" height="61" rx="8" fill="#f6f8fc"/><text x="102" y="937" class="body">创建 / 接入应用</text><text x="309" y="937" class="blue heading">→</text><rect x="348" y="900" width="215" height="61" rx="8" fill="#f6f8fc"/><text x="377" y="937" class="body">配置并发布机器人</text><text x="584" y="937" class="blue heading">→</text><rect x="623" y="900" width="215" height="61" rx="8" fill="#f6f8fc"/><text x="654" y="937" class="body">提供用户添加入口</text><text x="860" y="937" class="blue heading">→</text><rect x="898" y="900" width="188" height="61" rx="8" fill="#edf4ff"/><text x="921" y="937" class="body blue">用户自行绑定</text><text x="72" y="1013" class="small muted">发送消息是用户端最后一步；后台核验来源后完成绑定，不要求重复登录或再发第二条确认指令。</text><text x="47" y="1084" class="small muted">设计说明：绑定串是短期敏感凭证。复制成功不等于绑定成功，只有服务端确认后才显示已绑定。</text></svg>