ont-weight="600" fill="#5571b2"><tspan x="25" y="1142">ZZ</tspan></text><text font-size="12" fill="#8a97aa"><tspan x="67" y="1132">项目管理员</tspan><tspan x="1495" y="36">搜索页面与任务</tspan><tspan x="1540" y="933">只打开或转发链接不能完成绑定。</tspan></text><text font-size="13" font-weight="600" fill="#1a2739"><tspan x="292" y="36">agent-CI-Infra</tspan><tspan x="393" y="36">bot</tspan></text><text font-size="13" fill="#a8b2c3"><tspan x="385" y="36">/</tspan></text><text font-size="11" fill="#8a97aa"><tspan x="459" y="36">项目工作区</tspan><tspan x="290" y="108">／</tspan><tspan x="309" y="108">身份与渠道</tspan><tspan x="1564" y="1098">示例数据 · 所有操作仅作用于本地原型，不会修改项目或 GitHub</tspan></text><text font-size="10" fill="#93a0b3"><tspan x="1640" y="35">⌘ K</tspan></text><text font-size="10" fill="#94a0b2"><tspan x="1689" y="36">交互原型 · 示例数据</tspan></text><text font-size="11" fill="#64748b"><tspan x="260" y="108">项目</tspan></text><text font-size="30" font-weight="700" fill="#1a2739"><tspan x="260" y="154">飞书连接详情</tspan></text><text font-size="13" fill="#64748b"><tspan x="260" y="189">应用与租户身份、传输方式、回执和授权范围。</tspan></text><text font-size="13" font-weight="550" fill="#1a2739"><tspan x="1774" y="133">帮助与页面说明</tspan><tspan x="1555" y="885">演示绑定确认</tspan></text><text font-size="16" font-weight="650" fill="#1a2739"><tspan x="285" y="258">飞书 · 团队应用</tspan><tspan x="285" y="802">已批准的群范围</tspan><tspan x="1540" y="258">连接健康</tspan><tspan x="1540" y="572">双端绑定</tspan></text><text font-size="12" font-weight="550" fill="#435269"><tspan x="285" y="324">所属 GitHub 组织</tspan><tspan x="886" y="324">连接方式</tspan><tspan x="285" y="414">App ID</tspan><tspan x="886" y="414">App Secret</tspan><tspan x="285" y="505">安装 tenant_key</tspan><tspan x="886" y="505">允许操作者租户</tspan></text><text font-size="13" fill="#1a2739"><tspan x="298" y="361">agent-CI-Infra</tspan><tspan x="898" y="361">SDK 长连接</tspan><tspan x="298" y="452">cli_demo_example</tspan><tspan x="298" y="542">tenant-demo</tspan><tspan x="898" y="542">tenant-demo</tspan><tspan x="