 fill="#8a97aa"><tspan x="459" y="36">项目工作区</tspan><tspan x="290" y="108">／</tspan><tspan x="309" y="108">自动化与通知</tspan><tspan x="285" y="764">群受众和允许字段在发送前重新校验。</tspan><tspan x="1564" y="1156">示例数据 · 所有操作仅作用于本地原型，不会修改项目或 GitHub</tspan></text><text font-size="10" fill="#93a0b3"><tspan x="1640" y="35">⌘ K</tspan></text><text font-size="10" fill="#94a0b2"><tspan x="1689" y="36">交互原型 · 示例数据</tspan></text><text font-size="11" fill="#64748b"><tspan x="260" y="108">项目</tspan></text><text font-size="30" font-weight="700" fill="#1a2739"><tspan x="260" y="154">编辑定时计划</tspan></text><text font-size="13" fill="#64748b"><tspan x="260" y="189">先预览未来触发与报告，再保存。</tspan></text><text font-size="13" font-weight="550" fill="#1a2739"><tspan x="1774" y="133">帮助与页面说明</tspan><tspan x="327" y="955">预览触发与报告</tspan></text><text font-size="16" font-weight="650" fill="#1a2739"><tspan x="285" y="258">计划配置</tspan><tspan x="1540" y="258">未来三次触发</tspan><tspan x="1540" y="519">报告预览</tspan></text><text font-size="12" font-weight="550" fill="#435269"><tspan x="285" y="324">计划名称</tspan><tspan x="886" y="324">计划类型</tspan><tspan x="285" y="414">执行身份</tspan><tspan x="886" y="414">维护人</tspan><tspan x="285" y="505">IANA 时区</tspan><tspan x="886" y="505">频率</tspan><tspan x="285" y="595">触发时间</tspan><tspan x="886" y="595">报告窗口</tspan><tspan x="285" y="687">通知目的地</tspan><tspan x="285" y="804">检查说明</tspan></text><text font-size="13" fill="#1a2739"><tspan x="298" y="361">每日项目运行摘要</tspan><tspan x="898" y="361">日报 report.daily</tspan><tspan x="298" y="452">个人计划</tspan><tspan x="898" y="452">当前操作者</tspan><tspan x="298" y="542">Asia/Shanghai</tspan><tspan x="898" y="542">每天</tspan><tspan x="298" y="632">09:00</tspan><tspan x="898" y="632">过去 24 个真实小时</tspan><tspan x="298" y="725">飞书 · 项目维护群</tspan><tspan x="298" y="841">汇总任务失败、待处理事项与 CI 变化。</tspan></text><text font-size="13" font-weight="550" fill="#ffffff"><tspan x="460" y="955">保存计划</tspan></text><text font-size="12" fill="#44618d"><tspan x="304" y="1046">切换时区会重新计算未来触发。夏令时缺失时刻跳过，重复时刻只执行第一次。</tspan></text><text font-size="12" font-weight="650" fill="#44618d"><tspan x="304" y="1023">时间语义</tspan></text><text font-size="14" font-weight="700" fill="#1a2739"><tspan x="1540" y="326">11 月 11 日</tspan><tspan x="1540" y="362">11 月 12 日</tspan><tspan x="1540" y="396">11 月 13 日</tspan><tspan x="1540" y="587">项目运行摘要</tspan></text><text font-size="14" fill="#1a2739"><tspan x="1815" y="326">09:00</tspan><tspan x="1815" y="362">09:00</tspan><tspan x="1815" y="396">09:00</tspan></text><text font-size="12" fill="#64748b"><tspan x="1540" y="619">统计过去 24 个真实小时，显示实际时间窗口。</tspan><tspan x="1540" y="663">执行中</tspan><tspan x="1540" y="696">需人处理</tspan><tspan x="1540" y="729">任务失败</tspan><tspan x="1540" y="761">记录覆盖</tspan></text><text font-size="12" fill="#1a2739"><tspan x="1674" y="663">8</tspan><tspan x="1674" y="696">3</tspan><tspan x="1674" y="729">1</tspan><tspan x="1674" y="761">部分 CI 来源缺数</tspan></text><text font-size="12" fill="#906728"><tspan x="1559" y="884">定时正式发布当前明确不支持；不提供看似可用的“自动</tspan><tspan x="1559" y="904">发版”按钮。</tspan></text></g><g transform="translate(1960 50)" clip-path="url(#m)"><path fill="#ffffff" d="M0 0h390v60h-390Z"/><path fill="#ec9b52" stroke="#ffffff" stroke-width="2" d="M354 17.5h8v8h-8Z"/><path fill="#ffffff" stroke="#dce3ee" stroke-width="1" d="M18 173.5h137v40h-137Z"/><path fill="#ffffff" stroke="#e5eaf2" stroke-width="1" d="M18 233.5h354v1156.2h-354Z"/><path fill="#ffffff" stroke="#dfe5ef" stroke-width="1" d="M37 336.9h316v49.6h-316ZM37 432.9h316v46h-316ZM37 525.2h316v46h-316ZM37 617.6h316v49.6h-316ZM37 713.6h316v46h-316ZM37 806h316v46h-316Z"/><path fill="#ffffff" stroke="#e5eaf2" stroke-width="1" d="M0 774h390v70h-390Z"/><text font-size="12" font-weight="600" fill="#1a2739"><tspan x="46" y="33">agent-CI-Infra</tspan><tspan x="129" y="33">bot</tspan></text><text font-size="11" fill="#64748b"><tspan x="18" y="94">项目</tspan></text><text font-size="10" fill="#8a97aa"><tspan x="47" y="94">／</tspan><tspan x="64" y="94">自动