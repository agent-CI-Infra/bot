<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><title>知识库 v2：目录、文件预览、历史版本</title><desc>知识库按真实目录与文件组织，不再有经验候选、可信度、知识审批或角色记忆页面。桌面两栏按需展开历史，手机目录到预览到历史逐层导航。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft Yahei',sans-serif;fill:#18283e}.muted{fill:#718099}.blue{fill:#345ee8}.small{font-size:14px}.body{font-size:17px}.heading{font-size:22px;font-weight:650}.white{fill:white}</style><rect width="1600" height="1110" fill="#f6f8fc"/><text x="46" y="48" font-size="27" font-weight="700">项目知识库，就是目录里的一组文件</text><text x="46" y="79" class="muted body">修订 v2 · 目录 + 内容预览 + 历史版本 · 不再混入角色记忆与知识分类</text><rect x="44" y="111" width="1070" height="740" rx="13" fill="white" stroke="#e4eaf2"/><text x="71" y="145" class="small muted">开发工作台　 /　agent-CI-Infra / bot　 /　知识库</text><path d="M44 166H1114" stroke="#e4eaf2"/><text x="74" y="211" font-size="28" font-weight="700">项目知识库</text><text x="74" y="241" class="small muted">按目录查找文件，点击即可预览；查看历史不会修改当前文件。</text><rect x="866" y="190" width="101" height="40" rx="7" fill="white" stroke="#e4eaf2"/><text x="889" y="216" class="small">新建文件</text><rect x="979" y="190" width="108" height="40" rx="7" fill="#345ee8"/><text x="993" y="216" class="small white">新建文件夹</text><rect x="67" y="266" width="1023" height="556" rx="9" fill="white" stroke="#e4eaf2"/><path d="M294 266V822" stroke="#e4eaf2"/><rect x="68" y="267" width="226" height="554" rx="8" fill="#fbfcfe"/><text x="87" y="300" class="body" font-weight="650">目录</text><text x="220" y="300" class="small muted">7 个文件</text><rect x="83" y="317" width="195" height="37" rx="6" fill="white" stroke="#e4eaf2"/><text x="95" y="341" class="small muted">搜索文件名…</text><text x="88" y="389" class="small">⌄　项目说明</text><text x="111" y="424" class="small muted">▤　README.md</text><text x="88" y="465" class="small">⌄　开发规范</text><rect x="82" y="479" width="197" height="38" rx="5" fill="#eaf0ff"/><text x="111" y="505" class="small blue" font-weight="600">▤　开发约定.md</text><text x="111" y="546" class="small muted">▤　代码检视.md</text><text x="88" y="591" class="small">⌄　接入指南</text><text x="111" y="626" class="small muted">▤　飞书接入.md</text><text x="111" y="664" class="small muted">▤　Webhook.md</text><text x="88" y="706" class="small">⌄　运行手册</text><text x="111" y="741" class="small muted">▤　恢复流程.md</text><text x="111" y="779" class="small muted">▤　故障排查.txt</text><text x="316" y="299" class="body" font-weight="650">开发规范 / 开发约定.md</text><text x="316" y="326" class="small muted">Markdown · 2.4 KB · 当前版本 v8</text><rect x="845" y="282" width="58" height="37" rx="6" fill="#f6f8fc"/><text x="861" y="306" class="small muted">编辑</text><rect x="912" y="282" width="58" height="37" rx="6" fill="white" stroke="#e4eaf2"/><text x="928" y="306" class="small">下载</text><rect x="979" y="282" width="95" height="37" rx="6" fill="#eef3ff"/><text x="993" y="306" class="small blue">历史版本</text><path d="M295 346H1089" stroke="#e4eaf2"/><rect x="295" y="347" width="794" height="49" fill="#fff7e8"/><text x="314" y="377" class="small" style="fill:#94702f">正在查看 v6 · 只读，当前文件仍为 v8</text><text x="906" y="377" class="small blue">返回当前版本</text><path d="M833 396V821" stroke="#e4eaf2"/><text x="335" y="446" font-size="28" font-weight="650">开发约定</text><text x="335" y="481" class="small muted">记录项目开发方式，供团队共同维护。</text><text x="335" y="532" class="body" font-weight="650">01　目录与命名</text><text x="335" y="564" class="small muted">业务代码放在 src/，测试放在 test/。</text><text x="335" y="594" class="small muted">文档按用途存放，文件名直接说明内容。</text><text x="335" y="644" class="body" font-weight="650">02　提交前检查</text><rect x="335" y="663" width="456" height="59" rx="7" fill="#f6f8fc" stroke="#e4eaf2"/><text x="354" y="699" class="small muted" style="font-family:monospace">npm run check</text><text x="335" y="765" class="body" font-weight="650">03　变更说明</text><text x="335" y="795" class="small muted">说明改动的范围、原因与实际验证结果。</text><text x="852" y="433" class="body" font-weight="650">历史版本</text><text x="1052" y="433" class="small muted">×</text><text x="854" y="479" class="body" font-weight="600">v8</text><rect x="998" y="460" width="74" height="25" rx="4" fill="#eaf7f0"/><text x="1007" y="478" class="small" style="fill:#168966">当前版本</text><text x="854" y="506" class="small muted">更新测试命令与提交要求</text><text x="854" y="532" font-size="12" class="muted">11 月 10 日 16:08 · 林舟</text><text x="854" y="576" class="body" font-weight="600">v7</text><text x="854" y="602" class="small muted">补充提交前检查</text><text x="854" y="628" font-size="12" class="muted">11 月 9 日 14:32 · 林舟</text><rect x="844" y="650" width="233" height="111" rx="7" fill="#f0f5ff" stroke="#cddcff"/><text x="859" y="681" class="body blue" font-weight="600">v6</text><text x="859" y="708" class="small muted">创建开发约定</text><text x="859" y="734" font-size="12" class="muted">11 月 8 日 10:15 · 陈雨</text><text x="853" y="798" font-size="12" class="muted">选择旧版本，只读查看。</text><text x="1167" y="139" class="body muted">移动端 · 三层查看</text><rect x="1153" y="163" width="403" height="687" rx="18" fill="white" stroke="#dce4f0"/><text x="1176" y="205" class="body">‹　开发约定.md</text><path d="M1153 226H1556" stroke="#e4eaf2"/><text x="1176" y="269" font-size="24" font-weight="650">历史版本</text><text x="1176" y="299" class="small muted">点选版本，查看当时的完整内容。</text><rect x="1175" y="323" width="359" height="112" rx="9" fill="#fbfcfe" stroke="#e4eaf2"/><text x="1195" y="358" class="body" font-weight="650">v8</text><text x="1429" y="358" class="small" style="fill:#168966">当前版本</text><text x="1195" y="390" class="small">更新测试命令与提交要求</text><text x="1195" y="416" font-size="12" class="muted">11 月 10 日 16:08 · 林舟</text><rect x="1175" y="451" width="359" height="112" rx="9" fill="white" stroke="#e4eaf2"/><text x="1195" y="486" class="body" font-weight="650">v7</text><text x="1195" y="518" class="small">补充提交前检查</text><text x="1195" y="544" font-size="12" class="muted">11 月 9 日 14:32 · 林舟</text><rect x="1175" y="579" width="359" height="112" rx="9" fill="#f0f5ff" stroke="#cddcff"/><text x="1195" y="614" class="body blue" font-weight="650">v6</text><text x="1195" y="646" class="small">创建开发约定</text><text x="1195" y="672" font-size="12" class="muted">11 月 8 日 10:15 · 陈雨</text><text x="1177" y="735" class="small muted">查看不会改变当前版本。</text><text x="1177" y="765" class="small muted">恢复时创建新版本，保留旧历史。</text><path d="M1153 795H1556" stroke="#e4eaf2"/><text x="1184" y="830" class="small muted">总览　　　任务　　　待处理　　　更多</text><rect x="44" y="878" width="1512" height="168" rx="12" fill="white" stroke="#e4eaf2"/><text x="72" y="916" class="heading">更少的概念，更直接的操作</text><text x="74" y="955" class="body">桌面：目录树 → 文件预览 → 右侧历史版本</text><text x="811" y="955" class="body">手机：目录列表 → 文件全屏 → 版本列表 → 旧版预览</text><text x="74" y="1008" class="small muted">不显示：经验候选、知识可信度、验证者、角色记忆、知识晋升。底层已有数据与权限保留，不做破坏性删除。</text><text x="47" y="1084" class="small muted">设计与实现边界：当前文件 API 为扁平文件名；真实目录需要补充目录/路径能力，不能只在 UI 里画分类冒充文件夹。</text></svg>