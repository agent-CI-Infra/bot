">设计目录 · 57 页</tspan><tspan x="1712" y="507">新建任务</tspan><tspan x="1699" y="557">设置定时计划</tspan><tspan x="1712" y="607">角色配置</tspan></text><text font-size="11" font-weight="600" fill="#5571b2"><tspan x="25" y="1142">ZZ</tspan><tspan x="1518" y="330">ZZ</tspan><tspan x="1518" y="685">ZZ</tspan></text><text font-size="12" fill="#8a97aa"><tspan x="67" y="1132">项目管理员</tspan><tspan x="1495" y="36">搜索页面与任务</tspan><tspan x="600" y="545">目标：T-1018 · 数据版本 v2</tspan><tspan x="600" y="858">task.contract · v2 → v3</tspan><tspan x="600" y="881">旧候选与旧验收将失效，任务保留原 ID 和历史。</tspan><tspan x="1594" y="655">聊天与显式表单调用同一管理服务。模型不能指</tspan><tspan x="1594" y="674">定身份或扩大能力。</tspan></text><text font-size="13" font-weight="600" fill="#1a2739"><tspan x="292" y="36">agent-CI-Infra</tspan><tspan x="393" y="36">bot</tspan></text><text font-size="13" fill="#a8b2c3"><tspan x="385" y="36">/</tspan></text><text font-size="11" fill="#8a97aa"><tspan x="459" y="36">项目工作区</tspan><tspan x="290" y="108">／</tspan><tspan x="309" y="108">工作空间</tspan><tspan x="515" y="1170">⌘ / Ctrl + Enter 发送 · 当前项目范围</tspan></text><text font-size="10" fill="#93a0b3"><tspan x="1640" y="35">⌘ K</tspan></text><text font-size="10" fill="#94a0b2"><tspan x="1689" y="36">交互原型 · 示例数据</tspan></text><text font-size="11" fill="#64748b"><tspan x="260" y="108">项目</tspan></text><text font-size="30" font-weight="700" fill="#1a2739"><tspan x="260" y="154">管理助手</tspan></text><text font-size="13" fill="#64748b"><tspan x="260" y="189">会话不替代权限与确定性命令，修改有回执。</tspan></text><text font-size="13" font-weight="550" fill="#1a2739"><tspan x="1813" y="133">切换范围</tspan></text><text font-size="16" font-weight="650" fill="#1a2739"><tspan x="275" y="258">会</tspan><tspan x="275" y="282">话</tspan><tspan x="1594" y="262">当前上下文</tspan></text><text font-size="12" font-weight="550" fill="#64748b"><tspan x="342" y="268">新建</tspan><tspan x="729" y="254">切换</tspan></text><text font-size="12" font-weight="650" fill="#345ee8"><tspan x="287" y="336">分析任务阻塞</tspan></text><text font-size="12" fill="#64748b"><tspan x="287" y="390">调整检视模型</tspan><tspan x="287" y="444">接入日报通知</tspan><tspan x="1594" y="302">项目</tspan><tspan x="1594" y="335">任务</tspan><tspan x="1594" y="368">合同</tspan><tspan x="1594" y="401">状态</tspan></text><text font-size="12" font-weight="700" fill="#64748b"><tspan x="532" y="254">当前范围：agent-CI-Infra / bot</tspan></text><text font-size="11" font-weight="550" fill="#64748b"><tspan x="782" y="254">只在明确操作时修改</tspan></text><text font-size="13" fill="#1a2739"><tspan x="1271" y="342">为什么 Issue #218 一直没有继续？</tspan><tspan x="584" y="428">它在等待确认旧 API 兼容范围，不是模型或环境故障。</tspan><tspan x="584" y="471">当前合同没有说明是否保留旧字段；继续实现前，需要补齐这个决定。</tspan><tspan x="1306" y="698">保留旧字段，增加弃用提示。</tspan><tspan x="584" y="783">这会改变验收范围，需要新合同版本。</tspan><tspan x="530" y="1073">描述你要查询或修改的内容…</tspan></text><text font-size="11" font-weight="600" fill="#345ee8"><tspan x="529" y="415">AI</tspan><tspan x="529" y="770">AI</tspan></text><text font-size="13" font-weight="700" fill="#1a2739"><tspan x="600" y="523">查询回执</tspan><tspan x="600" y="836">变更预览</tspan></text><text font-size="11" font-weight="550" fill="#18795b"><tspan x="922" y="522">只读查询</tspan></text><text font-size="13" fill="#345ee8"><tspan x="600" y="592">查看问题与证据</tspan></text><text font-size="11" font-weight="550" fill="#9a6415"><tspan x="809" y="835">尚未执行</tspan></text><text font-size="12" font-weight="550" fill="#8a97aa"><tspan x="611" y="927">查看差异</tspan><tspan x="693" y="927">确认修改</tspan></text><text font-size="13" font-weight="550" fill="#ffffff"><tspan x="1504" y="1170">发送</tspan></text><text font-size="12" fill="#1a2739"><tspan x="1684" y="302">agent-CI-Infra/bot</tspan><tspan x="1684" y="335">T-1018</tspan><tspan x="1684" y="368">v2</tspan><tspan x="1684" y="401">等待决定</tspan></text><text font-size="14" font-weight="600" fill="#1a2739"><tspan x="1594" y="456">可用快捷操作</tspan></text></g><g transform="translate(1960 50)" clip-path="url(#m)"><path fill="#ffffff" d="M0 0h390v60h-390Z"/><path fill="#ec