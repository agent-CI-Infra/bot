# Runs the images published from main; nothing is built on this machine.
#   docker compose -f docker/compose.yaml up -d   (or download compose.yaml alone and run: docker compose up -d)
# BOT_IMAGE_TAG (default latest, the head of main) pins every image to a release such as v1.2.0 or to sha-<commit>.
# Upgrade with `docker compose pull` and `docker compose up -d`. Never add --volumes (-v) to `down`: that deletes
# the master key, the internal credentials and the databases. docker/compose.build.yaml builds the same services from source.
services:
  key-init:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    command: ["node", "dist/keygen.js", "/keys/master.key", "/internal/manager.token"]
    environment:
      BOT_TOOL_RESULTS_DIR: /tool-results
      BOT_DATABASE_PATH: /data/control.sqlite
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - bot-keys:/keys
      - bot-data:/data
      - tool-results:/tool-results
      - internal-keys:/internal
    healthcheck:
      disable: true
    restart: "no"
  bot:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    depends_on:
      key-init:
        condition: service_completed_successfully
      manager:
        condition: service_healthy
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_DATABASE_PATH: /data/control.sqlite
      BOT_TOOL_RESULTS_DIR: /tool-results
      BOT_PROJECT_TOOLS_DIR: /project-tools
      BOT_SKILL_STORE_DIR: /skill-store
      BOT_AGENT_TOOLS_AUTO_INSTALL: "${BOT_AGENT_TOOLS_AUTO_INSTALL:-1}"
      BOT_MASTER_KEY_FILE: /keys/master.key
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      BOT_MANAGER_URL: http://manager:8793
      BOT_HOST_STORAGE_DIR: /run/host-storage
      BOT_COMMAND_TIMEOUT_MAX_SECONDS: "${BOT_COMMAND_TIMEOUT_MAX_SECONDS:-600}"
      BOT_GITHUB_API_URL: "${BOT_GITHUB_API_URL:-https://api.github.com}"
      BOT_MENTION_NAMES: "${BOT_MENTION_NAMES-bot,agent-ci-infra-bot}"
      BOT_OBSOLETE_FAILURE_DAYS: "${BOT_OBSOLETE_FAILURE_DAYS:-7}"
      BOT_PR_PATROL_INTERVAL_MS: "${BOT_PR_PATROL_INTERVAL_MS:-21600000}"
      BOT_PR_PATROL_COOLDOWN_MS: "${BOT_PR_PATROL_COOLDOWN_MS:-86400000}"
      # Notes-volume reclamation of committed deletions (#771): retries, backoff and the readiness tiers.
      BOT_NOTES_RECLAIM_ATTEMPTS: "${BOT_NOTES_RECLAIM_ATTEMPTS:-6}"
      BOT_NOTES_RECLAIM_DELAY_MS: "${BOT_NOTES_RECLAIM_DELAY_MS:-60000}"
      BOT_NOTES_ORPHAN_THRESHOLD: "${BOT_NOTES_ORPHAN_THRESHOLD:-10}"
      BOT_NOTES_ORPHAN_MAX_AGE_MS: "${BOT_NOTES_ORPHAN_MAX_AGE_MS:-604800000}"
      BOT_NOTES_ORPHAN_WARN_AGE_MS: "${BOT_NOTES_ORPHAN_WARN_AGE_MS:-86400000}"
      BOT_FORWARD_PRIVATE_HOSTS: "${BOT_FORWARD_PRIVATE_HOSTS:-}"
      BOT_TRUSTED_PROXIES: "${BOT_TRUSTED_PROXIES:-}"
      BOT_COOKIE_SECURE: "${BOT_COOKIE_SECURE:-false}"
      BOT_GITHUB_OAUTH_CLIENT_ID: "${BOT_GITHUB_OAUTH_CLIENT_ID:-}"
      BOT_GITHUB_OAUTH_CLIENT_SECRET_FILE: "${BOT_GITHUB_OAUTH_CLIENT_SECRET_FILE:-/run/secrets/github-oauth-client-secret}"
      BOT_PUBLIC_ORIGIN: "${BOT_PUBLIC_ORIGIN:-}"
      # Deprecated alias of BOT_PUBLIC_ORIGIN, still read before v0.3.0; startup stops when the two differ.
      BOT_ADMIN_ORIGIN: "${BOT_ADMIN_ORIGIN:-}"
      BOT_TUNNEL_TOKEN_FILE: /tunnel/token
      BOT_TUNNEL_METRICS_URL: http://webhook:8794
      # The version the global settings page shows: the tag these images were pulled with.
      BOT_IMAGE_TAG: "${BOT_IMAGE_TAG:-latest}"
    stop_grace_period: 100s
    # The single business port: console, login, App callbacks and webhooks. It binds loopback by default, because it now
    # also serves the console and first-time setup; set BOT_BIND_ADDRESS=0.0.0.0 only for a reverse proxy on another host.
    # BOT_WEBHOOK_PORT is the deprecated name of BOT_PORT (read before v0.3.0); BOT_ADMIN_PORT no longer publishes anything.
    ports:
      - "${BOT_BIND_ADDRESS:-127.0.0.1}:${BOT_PORT:-${BOT_WEBHOOK_PORT:-8791}}:8791"
    volumes:
      - bot-data:/data
      - tool-results:/tool-results
      - bot-keys:/keys:ro
      - internal-keys:/internal:ro
      - tunnel-keys:/tunnel
      - ${BOT_HOST_STORAGE_DIR:-storage-metrics}:/run/host-storage:ro
      # Persistent HOME of every assistant computer (#457), one directory per group or person; the control plane reads,
      # writes, measures and deletes them as the computers' own user (10001).
      - assistant-homes:/assistant-homes
      # Trusted CLI and ACP product volume. The control plane and the administrator's ACP installer can write to it.
      # Project computers and isolated run containers mount it read-only at /opt/agent-tools.
      - agent-tools:/opt/agent-tools
      # Per-project isolated binary tool snapshots (/project-tools/<repository_id>/rev-<N>, #1322).
      # Only the control plane writes here; project computers and group assistants mount active revisions read-only.
      - project-tools:/project-tools
      # Content-addressed materialized skill sets (/skill-store/projects/<repository_id>/sets/<hash> & /skill-store/service/sets/<hash>, #1359).
      # Only the control plane writes here; project and assistant computers mount their isolated scope read-only at /opt/bot-skills.
      - skill-store:/skill-store
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  tunnel:
    image: ghcr.io/agent-ci-infra/bot-cloudflare-tunnel:${BOT_IMAGE_TAG:-latest}
    volumes:
      - tunnel-keys:/tunnel:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  # Fixed gateway from the tunnel network to the business listener bot:8791 (the whole public entry). It runs from the
  # control-plane image but stays a separate container, so the tunnel never joins the control network and cannot reach
  # the manager. Cloudflare routes keep the service URL http://webhook:8791.
  webhook:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    command: ["node", "webhook/main.mjs"]
    networks: [control, edge]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  manager:
    image: ghcr.io/agent-ci-infra/bot-computer-manager:${BOT_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/ready', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      # Recovery runs serially and can include image builds and setup scripts for every saved project.
      start_period: 30m
      retries: 3
    depends_on:
      key-init:
        condition: service_completed_successfully
      project-image:
        condition: service_completed_successfully
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      # The manager only inspects this image and never pulls; it must equal the project-image reference below, tag included.
      BOT_PROJECT_IMAGE: ghcr.io/agent-ci-infra/bot-project-computer:${BOT_IMAGE_TAG:-latest}
      BOT_TOOL_RESULTS_DIR: /tool-results
      BOT_PROJECT_TOOLS_DIR: /project-tools
      BOT_SKILL_STORE_DIR: /skill-store
      BOT_PROJECT_EGRESS: "${BOT_PROJECT_EGRESS:-true}"
    volumes:
      - manager-data:/data
      - tool-results:/tool-results:ro
      - internal-keys:/internal:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the manager finds the volume's name here and mounts one owner's HOME directory (a subpath) per computer.
      - assistant-homes:/assistant-homes:ro
      # Read-only: the manager finds the tool volume's name here and mounts it read-only at /opt/agent-tools.
      - agent-tools:/opt/agent-tools:ro
      # Read-only: the manager finds the project-tools volume name and validates each active rev-<N> before subpath mount.
      - project-tools:/project-tools:ro
      # Read-only: the manager finds the skill-store volume name and validates each scope directory before subpath mount.
      - skill-store:/skill-store:ro
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 100s
    restart: unless-stopped
  # Exits at once; it exists so Compose pulls the project image into the local Docker before the manager starts.
  project-image:
    image: ghcr.io/agent-ci-infra/bot-project-computer:${BOT_IMAGE_TAG:-latest}
    command: ["node", "-e", "process.exit(0)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
volumes:
  storage-metrics:
  tool-results:
    labels:
      department.bot.kind: tool-results
  agent-tools:
    labels:
      department.bot.kind: agent-tools
  project-tools:
    labels:
      department.bot.kind: project-tools
  skill-store:
    labels:
      department.bot.kind: skill-store
  assistant-homes:
  bot-data:
  bot-keys:
  internal-keys:
  manager-data:
  tunnel-keys:
networks:
  control:
    driver: bridge
  edge:
    driver: bridge
