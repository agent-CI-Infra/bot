name: Checks

# Source checks for pull requests and the merge queue. Together with the image builds in images.yml, the jobs here
# are the required status checks of main, so they must also run on merge_group or the queue never merges.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same major version as the node:22 base of the images.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is downloaded once per Playwright version (pinned in package-lock.json) and restored from the Actions
      # cache afterwards. The runner image usually has every system library the headless shell needs, so they are installed
      # only when a dry run reports some missing (installing them takes 15-30 seconds of apt).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell
      - run: npx playwright install-deps --dry-run chromium-headless-shell || npx playwright install-deps chromium-headless-shell

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: .tmp/e2e-results
          retention-days: 7
