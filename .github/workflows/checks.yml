name: Checks

# Source checks for pull requests and the merge queue. Together with the image builds in images.yml, the jobs here
# are the required status checks of main, so they must also run on merge_group or the queue never merges.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same major version as the node:22 base of the images.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is downloaded once per Playwright version (pinned in package-lock.json) and restored from the Actions
      # cache afterwards, together with the Chinese font the console is drawn with (for readable failure screenshots).
      # The runner image already has the browser's shared libraries; of Playwright's system packages only fonts are
      # missing there, and installing them through apt takes 10-15 seconds, so a cache hit skips apt unless a library is missing.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/e2e-fonts
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell-fonts
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium --only-shell
          mkdir -p ~/.cache/e2e-fonts && cp /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc ~/.cache/e2e-fonts/
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: |
          if ldd ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | grep 'not found'; then
            npx playwright install-deps chromium-headless-shell
          fi
          mkdir -p ~/.local/share/fonts && cp ~/.cache/e2e-fonts/* ~/.local/share/fonts/

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: .tmp/e2e-results
          retention-days: 7
