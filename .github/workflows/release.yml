name: Release

# Pushing a tag v* releases a commit of main. Nothing is rebuilt: the sha-<12-character commit> images that
# images.yml published for that commit also get the tag as their version, so a release runs exactly the images the
# merge queue checked. Then a GitHub release is created and the version is deployed to the server of the production
# environment; until that environment names a server, deployment is skipped with a notice.
# A manual run only checks SSH connectivity; it never publishes or deploys a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled half way through a deployment.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # The images built by images.yml.
  IMAGES: bot-control-plane bot-computer-manager bot-project-computer bot-cloudflare-tunnel

jobs:
  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The wait for the Images run below is 30 minutes at most; a registry or gh call that hangs ends shortly after it.
    timeout-minutes: 45
    permissions:
      actions: read     # find the Images run of the tagged commit
      contents: write   # create the GitHub release
      packages: write   # add the version tag to the images
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for the images of the tagged commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          # The comparison <sha>...main is "ahead" or "identical" only when main contains the commit.
          status=$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error title=$TAG is not on main::$TAG points at $sha, which main does not contain. Delete the tag and tag a commit of main."
            exit 1
          fi
          # A tag pushed right after a merge may arrive while main is still publishing; wait up to 30 minutes.
          for attempt in $(seq 1 60); do
            run=$(gh run list --workflow images.yml --event push --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "short=${sha::12}" >> "$GITHUB_OUTPUT"; exit 0 ;;
              # Still no run after two minutes means the commit was not the head of a push to main; a cancelled
              # or failed run never published either.
              ""|completed*)
                if [ -n "$run" ] || [ "$attempt" -ge 4 ]; then
                  echo "::error title=No images for $TAG::main did not publish images for $sha (Images run: ${run:-none}). Tag the latest commit of main instead."
                  exit 1
                fi ;;
            esac
            sleep 30
          done
          echo "::error title=No images for $TAG::The Images run of $sha did not finish within 30 minutes."
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          for name in $IMAGES; do
            docker buildx imagetools create --tag "ghcr.io/agent-ci-infra/$name:$TAG" "ghcr.io/agent-ci-infra/$name:sha-$SHORT"
          done

      - name: Create the GitHub release
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          notes="Images (\`linux/amd64\`, the same as \`sha-$SHORT\`). Deploy with \`BOT_IMAGE_TAG=$TAG\` in the \`.env\` next to \`compose.yaml\`."
          for name in $IMAGES; do notes+=$'\n'"- \`ghcr.io/agent-ci-infra/$name:$TAG\`"; done
          # A tag with a suffix such as v1.2.0-rc.1 is a prerelease.
          prerelease=; case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --generate-notes $prerelease

  deploy:
    name: deploy
    needs: release
    # A manual check must run even though the release job was deliberately skipped.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    # The step below waits up to 30 minutes for the manager to start and up to 85 minutes for bot to become healthy
    # (about 88 minutes of wall clock once the loop's docker inspect calls are counted); a hung pull or recreate ends
    # inside that budget, not at the platform ceiling.
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The optional jump host uses the same deployment key, but has its own pinned host keys.
      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_JUMP_HOST: ${{ vars.DEPLOY_JUMP_HOST }}
          DEPLOY_JUMP_PORT: ${{ vars.DEPLOY_JUMP_PORT || '22' }}
          DEPLOY_JUMP_USER: ${{ vars.DEPLOY_JUMP_USER }}
          DEPLOY_JUMP_KNOWN_HOSTS: ${{ vars.DEPLOY_JUMP_KNOWN_HOSTS }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            if [ "$CHECK_ONLY" = true ]; then
              echo "::error title=SSH settings incomplete::DEPLOY_HOST is not set in the production environment."
              exit 1
            fi
            echo "::notice title=Deployment skipped::DEPLOY_HOST is not set in the production environment; $TAG was released but not deployed."
            exit 0
          fi
          missing=
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do [ -n "${!name}" ] || missing+=" $name"; done
          if [ -n "$DEPLOY_JUMP_HOST" ]; then
            for name in DEPLOY_JUMP_USER DEPLOY_JUMP_KNOWN_HOSTS; do [ -n "${!name}" ] || missing+=" $name"; done
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Deployment settings incomplete::Missing in the production environment:$missing"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Only the recorded host keys are trusted; an unknown or changed key stops the deployment.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_JUMP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          proxy_jump=
          if [ -n "$DEPLOY_JUMP_HOST" ]; then
            cat > ~/.ssh/config <<SSHCONFIG
          Host deploy-jump
            HostName $DEPLOY_JUMP_HOST
            Port $DEPLOY_JUMP_PORT
            User $DEPLOY_JUMP_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          SSHCONFIG
            proxy_jump='ProxyJump deploy-jump'
          else
            : > ~/.ssh/config
          fi
          cat >> ~/.ssh/config <<SSHCONFIG
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            # The deploy waits through a start that compacts the databases (#671); keep the quiet session alive.
            ServerAliveInterval 30
            ServerAliveCountMax 6
            $proxy_jump
          SSHCONFIG
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Check SSH connection
        if: steps.ssh.outputs.configured == 'true'
        timeout-minutes: 2
        run: |
          ssh deploy-target 'printf "SSH connection succeeded\n"; id'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'SSH check passed. No release or deployment was performed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Keep all server writes behind the tag-push condition, independently of the SSH check.
      - name: Deploy
        if: github.event_name == 'push' && steps.ssh.outputs.configured == 'true'
        # Under the job's 150 minutes, so the step that hangs fails first and shows its own log. Inside it the pull and
        # the recreate carry a bound of their own (15 + 35 minutes) and the health loop below allows 85 (#923: about 88
        # minutes of wall clock, because each round also makes two docker inspect calls), so the step's remaining
        # minutes cover the SSH session, the container sweep before the pull and the EXIT trap.
        timeout-minutes: 145
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          remote() { ssh deploy-target "$@"; }
          dir=$(printf %q "$DEPLOY_PATH")

          # The compose.yaml of the release replaces the server's; local changes belong in .env or compose.override.yaml.
          remote "mkdir -p $dir && cat > $dir/compose.yaml.next && mv $dir/compose.yaml.next $dir/compose.yaml" < docker/compose.yaml
          remote "bash -s -- $dir $(printf %q "$TAG")" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          recover_ingress() {
            for target in webhook tunnel; do
              for id in $(docker compose ps -a -q "$target" 2>/dev/null || true); do
                read -r name canonical state < <(docker inspect --format '{{.Name}} {{index .Config.Labels "com.docker.compose.project"}}-{{index .Config.Labels "com.docker.compose.service"}}-{{index .Config.Labels "com.docker.compose.container-number"}} {{.State.Status}}' "$id" 2>/dev/null || true)
                if [ "$name" = "/$canonical" ] && [ "$state" = created ]; then
                  echo "Restoring $canonical left in created state after deploy failure"
                  docker start "$id" > /dev/null 2>&1 || true
                fi
              done
            done
          }
          # Whatever step fails, restore any recreated ingress containers left in created state (avoiding HTTP 530),
          # then show every container of the project, including stopped and never-started ones.
          trap 'status=$?; if [ "$status" -ne 0 ]; then recover_ingress || true; docker compose ps -a || true; fi' EXIT
          # Pin the version in .env, so a later plain `docker compose up -d` keeps it; other settings stay.
          touch .env
          sed -i '/^BOT_IMAGE_TAG=/d' .env
          echo "BOT_IMAGE_TAG=$2" >> .env
          # Pull and recreate run under the server's own timeout: a bound on the local ssh would only end the client and
          # leave the command running here. 15 minutes for the pull and 35 for the recreate (the manager may take its
          # 30-minute start period), leaving the health wait below its 85 and the step inside its budget. -k 30s adds the
          # kill grace period: compose stops a container by asking the same daemon that may be the hang, so SIGTERM alone
          # can wait forever and the bound would never fire (#923).
          timeout -k 30s 15m docker compose pull
          # Compose names a service container <project>-<service>-<number>. To recreate one it creates the replacement as
          # <old id>_<project>-<service>-<number>, removes the old container and only then renames the replacement. A
          # deployment interrupted in between leaves a second container for the service: a plain `up -d` adopts it under
          # that name, and recreating it conflicts with the old name. So first remove every container of the project's
          # services that lacks its canonical name. Such a replacement holds nothing (data is in volumes), and `ps` lists
          # only Compose's own service containers, not the project computers the manager starts.
          for id in $(docker compose ps -a -q); do
            read -r name canonical < <(docker inspect --format '{{.Name}} {{index .Config.Labels "com.docker.compose.project"}}-{{index .Config.Labels "com.docker.compose.service"}}-{{index .Config.Labels "com.docker.compose.container-number"}}' "$id") || continue
            if [ "$name" != "/$canonical" ]; then
              echo "Removing ${name#/}, left by an interrupted deployment of $canonical"
              docker rm -f "$id" > /dev/null
            fi
          done
          # Recreate every service from this release's compose.yaml, so running this job again converges whatever an
          # interrupted deployment left. A release changes every image tag, so every container is recreated anyway and a
          # normal deployment is down no longer.
          timeout -k 30s 35m docker compose up -d --force-recreate
          # The control-plane image's healthcheck turns healthy once the business listener (8791) answers. A start that
          # compacts control.sqlite first (#671, docs/deployment.md) listens only afterwards: wait while the container keeps
          # running, up to 85 minutes (1700 rounds of 3 seconds, plus two docker inspect calls each, so about 88
          # minutes of wall clock at most), and show the compaction's progress; a container that stops fails at once.
          bot=$(docker compose ps -q bot)
          for i in $(seq 1 1700); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$bot")" = healthy ]; then docker compose ps; exit 0; fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$bot")" != running ]; then break; fi
            if [ $((i % 20)) = 0 ]; then docker compose logs --since 60s bot manager 2>&1 | grep -E 'compact' | tail -2 || true; fi
            sleep 3
          done
          docker compose logs --tail 50 bot
          echo "bot did not become healthy" >&2
          exit 1
          SCRIPT
