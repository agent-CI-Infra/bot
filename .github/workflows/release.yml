name: Release

# Pushing a tag v* releases a commit of main. Nothing is rebuilt: the sha-<12-character commit> images that
# images.yml published for that commit also get the tag as their version, so a release runs exactly the images the
# merge queue checked. Then a GitHub release is created and the version is deployed to the server of the production
# environment; until that environment names a server, deployment is skipped with a notice.
# A manual run only checks SSH connectivity; it never publishes or deploys a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled half way through a deployment.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # The images built by images.yml.
  IMAGES: bot-control-plane bot-computer-manager bot-project-computer bot-cloudflare-tunnel

jobs:
  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read     # find the Images run of the tagged commit
      contents: write   # create the GitHub release
      packages: write   # add the version tag to the images
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for the images of the tagged commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          # The comparison <sha>...main is "ahead" or "identical" only when main contains the commit.
          status=$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error title=$TAG is not on main::$TAG points at $sha, which main does not contain. Delete the tag and tag a commit of main."
            exit 1
          fi
          # A tag pushed right after a merge may arrive while main is still publishing; wait up to 30 minutes.
          for attempt in $(seq 1 60); do
            run=$(gh run list --workflow images.yml --event push --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "short=${sha::12}" >> "$GITHUB_OUTPUT"; exit 0 ;;
              # Still no run after two minutes means the commit was not the head of a push to main; a cancelled
              # or failed run never published either.
              ""|completed*)
                if [ -n "$run" ] || [ "$attempt" -ge 4 ]; then
                  echo "::error title=No images for $TAG::main did not publish images for $sha (Images run: ${run:-none}). Tag the latest commit of main instead."
                  exit 1
                fi ;;
            esac
            sleep 30
          done
          echo "::error title=No images for $TAG::The Images run of $sha did not finish within 30 minutes."
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          for name in $IMAGES; do
            docker buildx imagetools create --tag "ghcr.io/agent-ci-infra/$name:$TAG" "ghcr.io/agent-ci-infra/$name:sha-$SHORT"
          done

      - name: Create the GitHub release
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          notes="Images (\`linux/amd64\`, the same as \`sha-$SHORT\`). Deploy with \`BOT_IMAGE_TAG=$TAG\` in the \`.env\` next to \`compose.yaml\`."
          for name in $IMAGES; do notes+=$'\n'"- \`ghcr.io/agent-ci-infra/$name:$TAG\`"; done
          # A tag with a suffix such as v1.2.0-rc.1 is a prerelease.
          prerelease=; case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --generate-notes $prerelease

  deploy:
    name: deploy
    needs: release
    # A manual check must run even though the release job was deliberately skipped.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The optional jump host uses the same deployment key, but has its own pinned host keys.
      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_JUMP_HOST: ${{ vars.DEPLOY_JUMP_HOST }}
          DEPLOY_JUMP_PORT: ${{ vars.DEPLOY_JUMP_PORT || '22' }}
          DEPLOY_JUMP_USER: ${{ vars.DEPLOY_JUMP_USER }}
          DEPLOY_JUMP_KNOWN_HOSTS: ${{ vars.DEPLOY_JUMP_KNOWN_HOSTS }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            if [ "$CHECK_ONLY" = true ]; then
              echo "::error title=SSH settings incomplete::DEPLOY_HOST is not set in the production environment."
              exit 1
            fi
            echo "::notice title=Deployment skipped::DEPLOY_HOST is not set in the production environment; $TAG was released but not deployed."
            exit 0
          fi
          missing=
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do [ -n "${!name}" ] || missing+=" $name"; done
          if [ -n "$DEPLOY_JUMP_HOST" ]; then
            for name in DEPLOY_JUMP_USER DEPLOY_JUMP_KNOWN_HOSTS; do [ -n "${!name}" ] || missing+=" $name"; done
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Deployment settings incomplete::Missing in the production environment:$missing"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Only the recorded host keys are trusted; an unknown or changed key stops the deployment.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" "$DEPLOY_JUMP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          proxy_jump=
          if [ -n "$DEPLOY_JUMP_HOST" ]; then
            cat > ~/.ssh/config <<SSHCONFIG
          Host deploy-jump
            HostName $DEPLOY_JUMP_HOST
            Port $DEPLOY_JUMP_PORT
            User $DEPLOY_JUMP_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          SSHCONFIG
            proxy_jump='ProxyJump deploy-jump'
          else
            : > ~/.ssh/config
          fi
          cat >> ~/.ssh/config <<SSHCONFIG
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            $proxy_jump
          SSHCONFIG
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Check SSH connection
        if: steps.ssh.outputs.configured == 'true'
        timeout-minutes: 2
        run: |
          ssh deploy-target 'printf "SSH connection succeeded\n"; id'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'SSH check passed. No release or deployment was performed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Keep all server writes behind the tag-push condition, independently of the SSH check.
      - name: Deploy
        if: github.event_name == 'push' && steps.ssh.outputs.configured == 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          remote() { ssh deploy-target "$@"; }
          dir=$(printf %q "$DEPLOY_PATH")

          # The compose.yaml of the release replaces the server's; local changes belong in .env or compose.override.yaml.
          remote "mkdir -p $dir && cat > $dir/compose.yaml.next && mv $dir/compose.yaml.next $dir/compose.yaml" < compose.yaml
          remote "bash -s -- $dir $(printf %q "$TAG")" <<'SCRIPT'
          set -euo pipefail
          cd "$1"
          # Whatever step fails, show every container of the project, including stopped and never-started ones.
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker compose ps -a || true; fi' EXIT
          # Pin the version in .env, so a later plain `docker compose up -d` keeps it; other settings stay.
          touch .env
          sed -i '/^BOT_IMAGE_TAG=/d' .env
          echo "BOT_IMAGE_TAG=$2" >> .env
          docker compose pull
          # Recreate every service from this release's compose.yaml, so running this job again converges after an
          # interrupted deployment: a plain `up -d` keeps the replacement containers an interrupted Compose created but
          # never started, and then waits on a dependency that has no health state. A release changes every image tag,
          # so every container is recreated anyway and a normal deployment is down no longer.
          docker compose up -d --force-recreate
          # The control-plane image's healthcheck turns healthy once the business listener (8791) answers.
          bot=$(docker compose ps -q bot)
          for _ in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$bot")" = healthy ]; then docker compose ps; exit 0; fi
            sleep 3
          done
          docker compose logs --tail 50 bot
          echo "bot did not become healthy" >&2
          exit 1
          SCRIPT
