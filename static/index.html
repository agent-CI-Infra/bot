<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>launchpad 管理</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/views.css"><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/costs.css"><link rel="stylesheet" href="/management.css"><link rel="stylesheet" href="/design.css"><script src="/app.js" defer></script><script src="/views.js" defer></script><script src="/gate-onboarding.js" defer></script><script src="/external.js" defer></script><script src="/project.js" defer></script><script src="/manager.js" defer></script><script src="/roles.js" defer></script><script src="/settings.js" defer></script><script src="/schedules.js" defer></script><script src="/vendor/marked.js" defer></script><script src="/vendor/purify.js" defer></script><script src="/management.js" defer></script><script src="/identity.js" defer></script><script src="/channels.js" defer></script><script src="/feishu-setup.js" defer></script><script src="/onboarding.js" defer></script><script src="/board.js" defer></script><script src="/metrics.js" defer></script><script src="/costs.js" defer></script><link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script><link rel="stylesheet" href="/models.css"><link rel="stylesheet" href="/access.css"><link rel="stylesheet" href="/workspace.css"><script src="/workspace.js" defer></script><script src="/design.js" defer></script><link rel="stylesheet" href="/task-create.css"><script src="/task-create.js" defer></script><link rel="stylesheet" href="/release.css"><script src="/release.js" defer></script></head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header><div class="brand"><strong>launchpad</strong><span class="sub">管理控制台</span></div><nav id="tabs" hidden aria-label="管理页面"><button data-tab="projects">项目</button><button data-tab="management">管理对话</button><button data-tab="identity">身份与权限</button><button data-tab="board">看板</button><button data-tab="costs">统计</button><button data-tab="events">Webhook 投递</button><button data-tab="external">外部执行端</button><button data-tab="settings" data-super>全局设置</button></nav><div id="identity" hidden><span id="who"></span><button id="logout" class="quiet">退出登录</button></div></header>
<aside id="console-sidebar" hidden aria-label="工作区导航"></aside>
<main id="main-content" tabindex="-1">
<section id="boot" class="boot"><p id="boot-message" role="status">正在载入…</p><button id="boot-retry" type="button" class="quiet" hidden>重试</button></section>
<section id="access" class="card access-layout" hidden aria-labelledby="access-title">
  <div class="access-intro"><p class="eyebrow">项目工作区</p><h2>看清进展，推进下一步。</h2><p>在同一处查看项目、跟进任务，并处理需要你决定的事项。</p><ul><li>查看真实的工作进展</li><li>按授权管理项目与团队</li><li>保留任务过程与交付证据</li></ul><p id="access-setup-note" hidden>首次使用先创建本地管理员，再按接入向导配置项目。</p></div>
  <div class="access-panel"><p class="eyebrow">管理入口</p><h1 id="access-title">登录</h1><p id="access-description"></p>
    <a id="github-login" class="access-provider-link" href="/auth/github/start" hidden>使用 GitHub 登录</a><p id="access-provider-note" class="muted"></p><p id="access-provider-status" role="status"></p><button id="access-provider-retry" class="quiet" type="button" hidden>重新读取登录入口</button>
    <p id="access-local-divider" class="access-divider" hidden>或使用本地账号</p>
    <form id="access-form"><label>用户名<input name="username" autocomplete="username" maxlength="100" required></label><label for="access-password">密码</label><div class="access-password-field"><input id="access-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" aria-describedby="access-password-help" required><button id="access-password-toggle" type="button" class="quiet" aria-controls="access-password" aria-pressed="false">显示密码</button></div><p id="access-password-help" class="muted">密码至少 12 个字符。</p><button type="submit" id="access-submit">登录</button></form>
    <div id="access-feedback"></div><p class="muted access-recovery-note">本地超级管理员可使用本地账号登录恢复访问。</p>
  </div>
</section>
<section id="workspace" hidden>
  <section class="card list-panel">
    <div class="heading toolbar"><div class="title-group"><h1 id="page-title"></h1><span id="count" class="muted" aria-live="polite"></span></div><div class="actions"><label class="check hidden-filter" id="hidden-filter-label" hidden><input type="checkbox" id="hidden-filter"> 已隐藏</label><button id="sync" class="quiet" hidden>同步安装列表</button><button id="refresh" class="quiet">刷新</button></div></div>
    <form id="filters"><label>仓库<select id="repository-filter"><option value="">所有有权访问的仓库</option></select></label><label id="account-filter-label" hidden>账号<select id="account-filter"><option value="">全部账号</option></select></label><label class="owner-filter">组织 ID<input id="owner-filter" placeholder="组织或用户 ID"></label><button type="submit" class="quiet">筛选</button></form>
    <div id="rows" class="rows" role="list" aria-labelledby="page-title"></div><div id="external-panel" hidden></div><div id="board-panel" hidden></div><div id="costs-panel" hidden></div><div id="identity-panel" hidden></div><div id="settings-panel" class="settings-panel" hidden></div>
    <div id="paging" class="actions" hidden><button id="previous" class="quiet">上一页</button><span id="page-number"></span><button id="next" class="quiet">下一页</button></div>
  </section>
  <section id="project-page" class="project-page" aria-label="项目设置" hidden></section>
<section id="console-page" hidden aria-live="polite"></section>
  <section id="design-page" class="design-page" aria-label="设计系统样例" hidden></section>
</section>
<p id="message" role="status" aria-live="polite"></p>
</main>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><p id="editor-note" class="muted">凭据仅保存，不会从读取接口返回。</p><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="detail"><div class="heading"><h2 id="detail-title">投递详情</h2><button id="close-detail" class="quiet">关闭</button></div><pre id="detail-body"></pre></dialog>
</body></html>
