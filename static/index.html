<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><script src="/locale-boot.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>launchpad 管理</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/views.css"><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/costs.css"><link rel="stylesheet" href="/management.css"><link rel="stylesheet" href="/design.css"><script src="/i18n.js" defer></script><script src="/app.js" defer></script><script src="/views.js" defer></script><script src="/gate-onboarding.js" defer></script><script src="/external.js" defer></script><script src="/project.js" defer></script><script src="/manager.js" defer></script><script src="/roles.js" defer></script><script src="/settings.js" defer></script><script src="/schedule-records.js" defer></script><script src="/subscriptions.js" defer></script><script src="/schedules.js" defer></script><link rel="stylesheet" href="/subscriptions.css"><link rel="stylesheet" href="/schedules.css"><link rel="stylesheet" href="/schedule-records.css"><script src="/vendor/marked.js" defer></script><script src="/vendor/purify.js" defer></script><script src="/management.js" defer></script><script src="/identity.js" defer></script><script src="/channels.js" defer></script><script src="/feishu-setup.js" defer></script><script src="/onboarding.js" defer></script><script src="/board.js" defer></script><script src="/metrics.js" defer></script><script src="/costs.js" defer></script><link rel="stylesheet" href="/shell.css"><script src="/shell.js" defer></script><link rel="stylesheet" href="/channel-console.css"><script src="/channel-console.js" defer></script><link rel="stylesheet" href="/models.css"><link rel="stylesheet" href="/access.css"><link rel="stylesheet" href="/workspace.css"><script src="/workspace.js" defer></script><script src="/design.js" defer></script><link rel="stylesheet" href="/task-create.css"><script src="/task-create.js" defer></script><link rel="stylesheet" href="/release.css"><script src="/release.js" defer></script><link rel="stylesheet" href="/gates.css"><link rel="stylesheet" href="/knowledge.css"><script src="/knowledge.js" defer></script></head>
<body>
<a class="skip-link" href="#main-content" data-i18n="chrome.skip">跳到主要内容</a>
<header><div class="brand"><strong>launchpad</strong><span class="sub" data-i18n="chrome.subtitle">管理控制台</span></div><nav id="tabs" hidden data-i18n="nav.pages" data-i18n-attr="aria-label" aria-label="管理页面"><button data-tab="projects" data-i18n="nav.projects">项目</button><button data-tab="management" data-i18n="nav.management">管理对话</button><button data-tab="board" data-i18n="nav.board">看板</button><button data-tab="costs" data-i18n="nav.costs">统计</button><button data-tab="events" data-i18n="nav.events">Webhook 投递</button><button data-tab="preferences" data-i18n="nav.preferences">个人设置</button><button data-tab="settings" data-super data-i18n="nav.settings">全局设置</button></nav><div id="header-tools"><div id="locale-switch" class="locale-switch" role="group" aria-label="界面语言"><button type="button" class="quiet" data-locale="zh-CN" aria-pressed="true">中文</button><button type="button" class="quiet" data-locale="en" aria-pressed="false">English</button></div><div id="identity" hidden><span id="who"></span><button id="logout" class="quiet" data-i18n="chrome.logout">退出登录</button></div></div></header>
<aside id="console-sidebar" hidden data-i18n="nav.sidebar" data-i18n-attr="aria-label" aria-label="工作区导航"></aside>
<main id="main-content" tabindex="-1">
<section id="boot" class="boot"><p id="boot-message" role="status" data-i18n="chrome.boot">正在载入…</p><button id="boot-retry" type="button" class="quiet" hidden data-i18n="chrome.boot_retry">重试</button></section>
<section id="access" class="card access-layout" hidden aria-labelledby="access-title">
  <div class="access-intro"><p class="eyebrow" data-i18n="login.eyebrow_intro">项目工作区</p><h2 data-i18n="login.intro_title">看清进展，推进下一步。</h2><p data-i18n="login.intro_lead">在同一处查看项目、跟进任务，并处理需要你决定的事项。</p><ul><li data-i18n="login.intro_progress">查看真实的工作进展</li><li data-i18n="login.intro_team">按授权管理项目与团队</li><li data-i18n="login.intro_evidence">保留任务过程与交付证据</li></ul><p id="access-setup-note" hidden data-i18n="login.setup_note">首次使用先创建本地管理员，再按接入向导配置项目。</p></div>
  <div class="access-panel"><p class="eyebrow" data-i18n="login.eyebrow_panel">管理入口</p><h1 id="access-title">登录</h1><p id="access-description"></p>
    <a id="github-login" class="access-provider-link" href="/auth/github/start" hidden data-i18n="login.github">使用 GitHub 登录</a><p id="access-provider-note" class="muted"></p><p id="access-provider-status" role="status"></p><button id="access-provider-retry" class="quiet" type="button" hidden data-i18n="login.github_retry">重新读取登录入口</button>
    <p id="access-local-divider" class="access-divider" hidden data-i18n="login.local_divider">或使用本地账号</p>
    <form id="access-form"><label><span data-i18n="login.username">用户名</span><input name="username" autocomplete="username" maxlength="100" required></label><label for="access-password" data-i18n="login.password">密码</label><div class="access-password-field"><input id="access-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" aria-describedby="access-password-help" required><button id="access-password-toggle" type="button" class="quiet" aria-controls="access-password" aria-pressed="false">显示密码</button></div><p id="access-password-help" class="muted" data-i18n="login.password_help">密码至少 12 个字符。</p><button type="submit" id="access-submit">登录</button></form>
    <div id="access-feedback"></div><p class="muted access-recovery-note" data-i18n="login.recovery">本地超级管理员可使用本地账号登录恢复访问。</p>
  </div>
</section>
<section id="workspace" hidden>
  <section class="card list-panel">
    <div class="heading toolbar"><div class="title-group"><h1 id="page-title"></h1><span id="count" class="muted" aria-live="polite"></span></div><div class="actions"><label class="check hidden-filter" id="hidden-filter-label" hidden><input type="checkbox" id="hidden-filter"> 已隐藏</label><button id="sync" class="quiet" hidden>同步安装列表</button><button id="refresh" class="quiet" data-i18n="action.refresh">刷新</button></div></div>
    <details class="console-filters-fold" data-testid="project-filters-fold" hidden><summary>筛选</summary><form id="filters"><label>仓库<select id="repository-filter"><option value="">所有有权访问的仓库</option></select></label><label id="account-filter-label" hidden>账号<select id="account-filter"><option value="">全部账号</option></select></label><label class="owner-filter">组织 ID<input id="owner-filter" placeholder="组织或用户 ID"></label><button type="submit" class="quiet">筛选</button></form></details>
    <div id="rows" class="rows" role="list" aria-labelledby="page-title"></div><div id="external-panel" hidden></div><div id="board-panel" hidden></div><div id="costs-panel" hidden></div><div id="identity-panel" hidden></div><div id="settings-panel" class="settings-panel" hidden></div>
    <div id="paging" class="actions" hidden><button id="previous" class="quiet">上一页</button><span id="page-number"></span><button id="next" class="quiet">下一页</button></div>
  </section>
  <section id="project-page" class="project-page" aria-label="项目设置" hidden></section>
<section id="console-page" hidden aria-live="polite"></section>
  <section id="design-page" class="design-page" aria-label="设计系统样例" hidden></section>
</section>
<p id="message" role="status" aria-live="polite"></p>
</main>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><p id="editor-note" class="muted">凭据仅保存，不会从读取接口返回。</p><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="detail"><div class="heading"><h2 id="detail-title">投递详情</h2><button id="close-detail" class="quiet">关闭</button></div><div id="detail-body"></div></dialog>
</body></html>
