<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>部门 Bot 管理</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/views.css"><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/costs.css"><script src="/app.js" defer></script><script src="/views.js" defer></script><script src="/external.js" defer></script><script src="/project.js" defer></script><script src="/onboarding.js" defer></script><script src="/board.js" defer></script><script src="/metrics.js" defer></script><script src="/costs.js" defer></script></head>
<body>
<header><div class="brand"><strong>部门 Bot</strong><span class="sub">管理控制台</span></div><nav id="tabs" hidden aria-label="管理页面"><button data-tab="projects">项目</button><button data-tab="board">看板</button><button data-tab="costs">成本</button><button data-tab="reviews">检视</button><button data-tab="developments">开发</button><button data-tab="events">Webhook 投递</button><button data-tab="external">外部执行端</button><button data-tab="onboarding" data-super>接入向导</button><button data-tab="accounts" data-super>机器人账号</button><button data-tab="users" data-super>用户</button></nav><div id="identity" hidden><span id="who"></span><button id="logout" class="quiet">退出登录</button></div></header>
<main>
<section id="access" class="card" hidden>
  <p class="eyebrow">管理入口</p><h1 id="access-title">登录</h1><p id="access-description"></p>
  <form id="access-form"><label>用户名<input name="username" autocomplete="username" maxlength="100" required></label><label>密码<input name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" required></label><button type="submit" id="access-submit">登录</button></form>
</section>
<section id="workspace" hidden>
  <section class="card list-panel">
    <div class="heading toolbar"><div class="title-group"><h1 id="page-title"></h1><span id="count" class="muted" aria-live="polite"></span></div><div class="actions"><button id="sync" class="quiet" hidden>同步安装列表</button><button id="check" class="quiet" hidden>检查接入</button><button id="refresh" class="quiet">刷新</button><button id="add" hidden>新增</button></div></div>
    <form id="filters"><label>仓库<select id="repository-filter"><option value="">所有有权访问的仓库</option></select></label><label id="account-filter-label" hidden>账号<select id="account-filter"><option value="">全部账号</option></select></label><label class="owner-filter">组织 ID<input id="owner-filter" placeholder="组织或用户 ID"></label><button type="submit" class="quiet">筛选</button></form>
    <div id="rows" class="rows" role="list" aria-labelledby="page-title"></div><div id="external-panel" hidden></div><div id="onboarding-panel" hidden></div><div id="board-panel" hidden></div><div id="costs-panel" hidden></div>
    <div id="paging" class="actions" hidden><button id="previous" class="quiet">上一页</button><span id="page-number"></span><button id="next" class="quiet">下一页</button></div>
  </section>
  <section id="project-page" class="project-page" aria-label="项目设置" hidden></section>
</section>
<p id="message" role="status" aria-live="polite"></p>
</main>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><p class="muted">凭据仅保存，不会从读取接口返回。</p><div id="editor-fields"></div><p id="editor-error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="detail"><div class="heading"><h2 id="detail-title">投递详情</h2><button id="close-detail" class="quiet">关闭</button></div><pre id="detail-body"></pre></dialog>
</body></html>
