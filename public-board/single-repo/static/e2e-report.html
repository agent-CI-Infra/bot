<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E 执行报告 · GitHub 状态看板</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .report-actions { flex: none; padding: 10px 18px; text-align: right; border-bottom: 1px solid #e3e6ea; background: #fff; }
  .report-actions a { color: #1769aa; font-size: .88rem; }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
  .error { padding: 24px; color: #9b1c1c; }
</style>
</head>
<body>
<div class="report-actions"><a id="back" href="./#tests">← 返回 E2E 看板</a></div>
<iframe id="report-frame" title="E2E 执行报告"></iframe>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const source = params.get('src') || '';
  const root = new URL('./e2e/', location.href);
  const report = new URL(source, location.href);
  // The viewer only displays a report hosted under this board's E2E directory.
  if (!source.startsWith('e2e/') || report.origin !== location.origin
      || !report.pathname.startsWith(root.pathname) || !report.pathname.endsWith('.html')) {
    document.getElementById('report-frame').remove();
    const message = document.createElement('p');
    message.className = 'error';
    message.textContent = '无法打开此执行报告。';
    document.body.append(message);
    return;
  }
  const back = new URL('./', location.href);
  if (params.get('line')) back.searchParams.set('returnLine', params.get('line'));
  if (params.get('case')) back.searchParams.set('returnE2E', params.get('case'));
  back.hash = 'tests';
  document.getElementById('back').href = back.href;
  const frame = document.getElementById('report-frame');
  // The local preview keeps the real index but not the large, already published HTML bundles.
  // Deployed Pages always uses its own copy; never fall back to another board's site.
  if (['127.0.0.1', 'localhost'].includes(location.hostname)) {
    fetch(report.href, { method: 'HEAD' }).then((response) => {
      if (response.ok) {
        frame.src = report.href;
        return;
      }
      frame.remove();
      const message = document.createElement('p');
      message.className = 'error';
      message.textContent = '本地预览没有该 E2E 报告副本，请打开已发布看板查看。';
      document.body.append(message);
    }).catch(() => { frame.src = report.href; });
  } else {
    frame.src = report.href;
  }
})();
</script>
</body>
</html>
