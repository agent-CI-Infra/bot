# Builds every image from this checkout instead of pulling the published ones. It only overrides image names and
# adds build contexts, so use it on top of compose.yaml, which holds the rest of the deployment:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  key-init:
    image: department-bot-control-plane:local
    build: .
  bot:
    image: department-bot-control-plane:local
    build: .
    environment:
      # Built from this checkout, not a published tag: the settings page reports a source build.
      BOT_IMAGE_TAG: ""
  webhook:
    image: department-bot-control-plane:local
    build: .
  tunnel:
    image: department-bot-cloudflare-tunnel:local
    build:
      context: .
      dockerfile: tunnel/Dockerfile
  manager:
    image: department-bot-computer-manager:local
    build:
      context: .
      dockerfile: manager/Dockerfile
    environment:
      # Must stay equal to the project-image reference below.
      BOT_PROJECT_IMAGE: department-bot-project-computer:local
  project-image:
    image: department-bot-project-computer:local
    build:
      context: .
      dockerfile: images/project/Dockerfile
