# Runs the images published from main; nothing is built on this machine.
#   docker compose up -d
# Upgrade with `docker compose pull` and `docker compose up -d`. Never add --volumes (-v) to `down`: that deletes
# the master key, the internal credentials and the databases. compose.build.yaml builds the same services from source.
services:
  key-init:
    image: ghcr.io/agent-ci-infra/bot-control-plane:latest
    command: ["node", "dist/keygen.js", "/keys/master.key", "/internal/manager.token"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - bot-keys:/keys
      - internal-keys:/internal
    healthcheck:
      disable: true
    restart: "no"
  bot:
    image: ghcr.io/agent-ci-infra/bot-control-plane:latest
    depends_on:
      key-init:
        condition: service_completed_successfully
      manager:
        condition: service_started
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_DATABASE_PATH: /data/control.sqlite
      BOT_MASTER_KEY_FILE: /keys/master.key
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      BOT_MANAGER_URL: http://manager:8793
      BOT_GITHUB_API_URL: "${BOT_GITHUB_API_URL:-https://api.github.com}"
      BOT_FORWARD_PRIVATE_HOSTS: "${BOT_FORWARD_PRIVATE_HOSTS:-}"
      BOT_COOKIE_SECURE: "${BOT_COOKIE_SECURE:-false}"
      BOT_ADMIN_ORIGIN: "${BOT_ADMIN_ORIGIN:-}"
      BOT_TUNNEL_TOKEN_FILE: /tunnel/token
      BOT_TUNNEL_METRICS_URL: http://webhook:8794
    stop_grace_period: 100s
    ports:
      - "0.0.0.0:${BOT_WEBHOOK_PORT:-8791}:8791"
      - "127.0.0.1:${BOT_ADMIN_PORT:-8792}:8792"
    volumes:
      - bot-data:/data
      - bot-keys:/keys:ro
      - internal-keys:/internal:ro
      - tunnel-keys:/tunnel
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  tunnel:
    image: ghcr.io/agent-ci-infra/bot-cloudflare-tunnel:latest
    volumes:
      - tunnel-keys:/tunnel:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  # Fixed gateway from the tunnel network to bot:8791. It runs from the control-plane image but stays a separate
  # container, so the tunnel can never reach the admin listener.
  webhook:
    image: ghcr.io/agent-ci-infra/bot-control-plane:latest
    command: ["node", "webhook/main.mjs"]
    networks: [control, edge]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  manager:
    image: ghcr.io/agent-ci-infra/bot-computer-manager:latest
    depends_on:
      key-init:
        condition: service_completed_successfully
      project-image:
        condition: service_completed_successfully
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      # The manager only inspects this image and never pulls; it must equal the project-image reference below, tag included.
      BOT_PROJECT_IMAGE: ghcr.io/agent-ci-infra/bot-project-computer:latest
      BOT_PROJECT_EGRESS: "${BOT_PROJECT_EGRESS:-true}"
    volumes:
      - manager-data:/data
      - internal-keys:/internal:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 100s
    restart: unless-stopped
  # Exits at once; it exists so Compose pulls the project image into the local Docker before the manager starts.
  project-image:
    image: ghcr.io/agent-ci-infra/bot-project-computer:latest
    command: ["node", "-e", "process.exit(0)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
volumes:
  bot-data:
  bot-keys:
  internal-keys:
  manager-data:
  tunnel-keys:
networks:
  control:
    driver: bridge
  edge:
    driver: bridge
