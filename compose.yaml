# Runs the images published from main; nothing is built on this machine.
#   docker compose up -d
# BOT_IMAGE_TAG (default latest, the head of main) pins every image to a release such as v1.2.0 or to sha-<commit>.
# Upgrade with `docker compose pull` and `docker compose up -d`. Never add --volumes (-v) to `down`: that deletes
# the master key, the internal credentials and the databases. compose.build.yaml builds the same services from source.
services:
  key-init:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    command: ["node", "dist/keygen.js", "/keys/master.key", "/internal/manager.token"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - bot-keys:/keys
      - internal-keys:/internal
    healthcheck:
      disable: true
    restart: "no"
  bot:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    depends_on:
      key-init:
        condition: service_completed_successfully
      manager:
        condition: service_healthy
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_DATABASE_PATH: /data/control.sqlite
      BOT_MASTER_KEY_FILE: /keys/master.key
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      BOT_MANAGER_URL: http://manager:8793
      BOT_GITHUB_API_URL: "${BOT_GITHUB_API_URL:-https://api.github.com}"
      BOT_MENTION_NAMES: "${BOT_MENTION_NAMES-bot,agent-ci-infra-bot}"
      BOT_FORWARD_PRIVATE_HOSTS: "${BOT_FORWARD_PRIVATE_HOSTS:-}"
      BOT_TRUSTED_PROXIES: "${BOT_TRUSTED_PROXIES:-}"
      BOT_COOKIE_SECURE: "${BOT_COOKIE_SECURE:-false}"
      BOT_GITHUB_OAUTH_CLIENT_ID: "${BOT_GITHUB_OAUTH_CLIENT_ID:-}"
      BOT_GITHUB_OAUTH_CLIENT_SECRET_FILE: "${BOT_GITHUB_OAUTH_CLIENT_SECRET_FILE:-/run/secrets/github-oauth-client-secret}"
      BOT_PUBLIC_ORIGIN: "${BOT_PUBLIC_ORIGIN:-}"
      # Deprecated alias of BOT_PUBLIC_ORIGIN, still read before v0.3.0; startup stops when the two differ.
      BOT_ADMIN_ORIGIN: "${BOT_ADMIN_ORIGIN:-}"
      BOT_TUNNEL_TOKEN_FILE: /tunnel/token
      BOT_TUNNEL_METRICS_URL: http://webhook:8794
      # The version the global settings page shows: the tag these images were pulled with.
      BOT_IMAGE_TAG: "${BOT_IMAGE_TAG:-latest}"
    stop_grace_period: 100s
    # The single business port: console, login, App callbacks and webhooks. It binds loopback by default, because it now
    # also serves the console and first-time setup; set BOT_BIND_ADDRESS=0.0.0.0 only for a reverse proxy on another host.
    # BOT_WEBHOOK_PORT is the deprecated name of BOT_PORT (read before v0.3.0); BOT_ADMIN_PORT no longer publishes anything.
    ports:
      - "${BOT_BIND_ADDRESS:-127.0.0.1}:${BOT_PORT:-${BOT_WEBHOOK_PORT:-8791}}:8791"
    volumes:
      - bot-data:/data
      - bot-keys:/keys:ro
      - internal-keys:/internal:ro
      - tunnel-keys:/tunnel
      # Persistent HOME of every assistant computer (#457), one directory per group or person; the control plane reads,
      # writes, measures and deletes them as the computers' own user (10001).
      - assistant-homes:/assistant-homes
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  tunnel:
    image: ghcr.io/agent-ci-infra/bot-cloudflare-tunnel:${BOT_IMAGE_TAG:-latest}
    volumes:
      - tunnel-keys:/tunnel:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  # Fixed gateway from the tunnel network to the business listener bot:8791 (the whole public entry). It runs from the
  # control-plane image but stays a separate container, so the tunnel never joins the control network and cannot reach
  # the manager. Cloudflare routes keep the service URL http://webhook:8791.
  webhook:
    image: ghcr.io/agent-ci-infra/bot-control-plane:${BOT_IMAGE_TAG:-latest}
    command: ["node", "webhook/main.mjs"]
    networks: [control, edge]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  manager:
    image: ghcr.io/agent-ci-infra/bot-computer-manager:${BOT_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/ready', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      # Recovery runs serially and can include image builds and setup scripts for every saved project.
      start_period: 30m
      retries: 3
    depends_on:
      key-init:
        condition: service_completed_successfully
      project-image:
        condition: service_completed_successfully
    environment:
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      # The manager only inspects this image and never pulls; it must equal the project-image reference below, tag included.
      BOT_PROJECT_IMAGE: ghcr.io/agent-ci-infra/bot-project-computer:${BOT_IMAGE_TAG:-latest}
      BOT_PROJECT_EGRESS: "${BOT_PROJECT_EGRESS:-true}"
    volumes:
      - manager-data:/data
      - internal-keys:/internal:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the manager finds the volume's name here and mounts one owner's HOME directory (a subpath) per computer.
      - assistant-homes:/assistant-homes:ro
    networks: [control]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 100s
    restart: unless-stopped
  # Exits at once; it exists so Compose pulls the project image into the local Docker before the manager starts.
  project-image:
    image: ghcr.io/agent-ci-infra/bot-project-computer:${BOT_IMAGE_TAG:-latest}
    command: ["node", "-e", "process.exit(0)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
volumes:
  assistant-homes:
  bot-data:
  bot-keys:
  internal-keys:
  manager-data:
  tunnel-keys:
networks:
  control:
    driver: bridge
  edge:
    driver: bridge
