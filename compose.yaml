services:
  key-init:
    image: department-bot:local
    build: .
    command: ["node", "dist/keygen.js", "/keys/master.key", "/internal/manager.token"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - bot-keys:/keys
      - internal-keys:/internal
    healthcheck:
      disable: true
    restart: "no"
  bot:
    image: department-bot:local
    build: .
    depends_on:
      key-init:
        condition: service_completed_successfully
      manager:
        condition: service_started
    environment:
      BOT_DATABASE_PATH: /data/control.sqlite
      BOT_MASTER_KEY_FILE: /keys/master.key
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      BOT_MANAGER_URL: http://manager:8793
      BOT_GITHUB_API_URL: "${BOT_GITHUB_API_URL:-https://api.github.com}"
      BOT_FORWARD_PRIVATE_HOSTS: "${BOT_FORWARD_PRIVATE_HOSTS:-}"
      BOT_COOKIE_SECURE: "${BOT_COOKIE_SECURE:-false}"
      BOT_ADMIN_ORIGIN: "${BOT_ADMIN_ORIGIN:-}"
      BOT_TUNNEL_TOKEN_FILE: /tunnel/token
      BOT_TUNNEL_METRICS_URL: http://webhook:8794
    stop_grace_period: 100s
    ports:
      - "0.0.0.0:${BOT_WEBHOOK_PORT:-8791}:8791"
      - "127.0.0.1:${BOT_ADMIN_PORT:-8792}:8792"
    volumes:
      - bot-data:/data
      - bot-keys:/keys:ro
      - internal-keys:/internal:ro
      - tunnel-keys:/tunnel
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  tunnel:
    image: department-bot-tunnel:local
    build:
      context: .
      dockerfile: tunnel/Dockerfile
    volumes:
      - tunnel-keys:/tunnel:ro
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  webhook:
    image: department-bot-webhook:local
    build:
      context: .
      dockerfile: webhook/Dockerfile
    networks: [control, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  manager:
    image: department-bot-manager:local
    build:
      context: .
      dockerfile: manager/Dockerfile
    depends_on:
      key-init:
        condition: service_completed_successfully
      project-image:
        condition: service_completed_successfully
    environment:
      BOT_MANAGER_TOKEN_FILE: /internal/manager.token
      BOT_PROJECT_IMAGE: department-bot-project:local
      BOT_PROJECT_EGRESS: "${BOT_PROJECT_EGRESS:-true}"
    volumes:
      - manager-data:/data
      - internal-keys:/internal:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 100s
    restart: unless-stopped
  project-image:
    image: department-bot-project:local
    build:
      context: .
      dockerfile: images/project/Dockerfile
    command: ["node", "-e", "process.exit(0)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
volumes:
  bot-data:
  bot-keys:
  internal-keys:
  manager-data:
  tunnel-keys:
networks:
  control:
    driver: bridge
  edge:
    driver: bridge
